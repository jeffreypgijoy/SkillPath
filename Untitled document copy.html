<style>

.grad-text{background:linear-gradient(115deg,#e0d9ff 0%,#a78bfa 25%,#7c5cff 50%,#60a5fa 75%,#22d3ee 100%);-webkit-background-clip:text;background-clip:text;color:transparent}

.ring-fill{stroke:url(#ringGrad);transition:stroke-dashoffset 1.4s cubic-bezier(.16,1,.3,1)}

.skeleton{background:linear-gradient(90deg,#131a2e 25%,#212a46 50%,#131a2e 75%);background-size:200% 100%;animation:shimmer 1.6s infinite;border-radius:8px}

input[type=text],input[type=email],input[type=tel],input[type=url],input[type=password],textarea,select{transition:border-color .2s,box-shadow .2s}

<body class="font-sans text-slate-300 antialiased overflow-x-hidden">
<div id="root"></div>
<div id="toasts" class="fixed bottom-6 right-6 z-[100] space-y-2 max-w-sm"></div>
<div id="modalRoot"></div>
<div id="fxRoot"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./supabase-config.js"></script>

<script>
/* ════════════════════════════════════════════════════════════════
   SKILLPATH — Complete placement prep LMS
   ════════════════════════════════════════════════════════════════ */


/* ── Utilities ── */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtT=s=>`${String(Math.floor(s/60)).padStart(2,'0')}:${String(Math.max(0,s%60)).padStart(2,'0')}`;
const fmtD=(d=new Date())=>new Date(d).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});
const rel=iso=>{const d=new Date(iso),n=Date.now(),s=(n-d)/1000;if(s<60)return'just now';if(s<3600)return`${Math.floor(s/60)}m ago`;if(s<86400)return`${Math.floor(s/3600)}h ago`;if(s<604800)return`${Math.floor(s/86400)}d ago`;return fmtD(iso)};
const ini=n=>(n||'').split(' ').map(p=>p[0]).slice(0,2).join('').toUpperCase();
const uid=()=>Math.random().toString(36).slice(2,10);
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const shuffle=a=>{const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};
const supabaseConfig=window.SKILLPATH_SUPABASE_CONFIG||{};
const supabaseClient=window.supabase?.createClient&&supabaseConfig.url&&supabaseConfig.anonKey
  ?window.supabase.createClient(supabaseConfig.url,supabaseConfig.anonKey)
  :null;
localStorage.removeItem('skillpath.gemini');
let cloudSaveTimer;
const translatedSource=new WeakMap();
const translationCache=new Map();
const TRANSLATION_CONSENT_KEY='skillpath.translation-consent';

async function requestAI(action,payload){
  if(!supabaseClient||!state.user?.authenticated)throw new Error('Configure Supabase and sign in to use AI features.');
  const{data,error}=await supabaseClient.functions.invoke('ai-assistant',{body:{action,payload}});
  if(error){
    let detail='';
    try{detail=(await error.context?.json())?.error||''}catch{}
    throw new Error(detail||error.message||'The AI request failed.');
  }
  if(data?.error)throw new Error(data.error);
  if(!data||!Object.hasOwn(data,'result'))throw new Error('The AI service returned an invalid response.');
  return data.result;
}

async function translateCurrentView(){
  if(state.lang!=='hi'||!supabaseClient||!state.user?.authenticated)return;
  const main=$('#mainContent');
  if(!main)return;
  const walker=document.createTreeWalker(main,NodeFilter.SHOW_TEXT,{
    acceptNode(node){
      const parent=node.parentElement;
      if(!parent||!node.textContent.trim()||parent.closest('svg,script,style,textarea,input,select,option,pre,code,.resume-doc,[data-no-translate]'))return NodeFilter.FILTER_REJECT;
      return NodeFilter.FILTER_ACCEPT;
    }
  });
  const nodes=[];
  while(walker.nextNode())nodes.push(walker.currentNode);
  const originals=nodes.map(node=>translatedSource.get(node)||node.textContent);
  const pending=[];
  for(let i=0;i<nodes.length;i++){
    const cached=translationCache.get(originals[i]);
    if(cached)nodes[i].textContent=cached;
    else pending.push(i);
  }
  if(!pending.length)return;
  for(let offset=0;offset<pending.length;offset+=40){
    const indexes=pending.slice(offset,offset+40);
    try{
      const result=await requestAI('translate_page',{strings:indexes.map(i=>originals[i])});
      const translations=result?.translations;
      if(!Array.isArray(translations)||translations.length!==indexes.length||translations.some(s=>typeof s!=='string')){
        throw new Error('Translation response did not match the displayed text.');
      }
      indexes.forEach((index,j)=>{
        if(state.lang!=='hi'||!nodes[index].isConnected)return;
        const translated=translations[j];
        translationCache.set(originals[index],translated);
        translatedSource.set(nodes[index],originals[index]);
        nodes[index].textContent=translated;
      });
    }catch(error){
      if(state.lang==='hi')toast(`Could not translate this page: ${error.message}`,'error',5000);
      return;
    }
  }
}


/* ── i18n ── */
const I18N={
  en:{dashboard:'Dashboard',learning:'Learning',tests:'Tests',analytics:'Analytics',code:'Code Practice',interview:'Mock Interview',resume:'Resume Builder',analyzer:'Resume Analyzer',companies:'Companies',jobs:'Job Board',leaderboard:'Leaderboard',badges:'Achievements',community:'Community',gd:'Group Discussion',fluency:'Fluency Lab',studyplan:'Study Plan',formulas:'Formula Cards',drive:'Mock Drives',certificates:'Certificates',portfolio:'Portfolio',overview:'Overview',practice:'Practice',career:'Career',social:'Community',manage:'Manage',content:'Content'},
  hi:{dashboard:'डैशबोर्ड',learning:'लर्निंग',tests:'टेस्ट',analytics:'एनालिटिक्स',code:'कोड प्रैक्टिस',interview:'मॉक इंटरव्यू',resume:'रेज़्यूमे बिल्डर',analyzer:'रेज़्यूमे एनालाइज़र',companies:'कंपनियाँ',jobs:'जॉब बोर्ड',leaderboard:'लीडरबोर्ड',badges:'उपलब्धियाँ',community:'कम्युनिटी',gd:'ग्रुप डिस्कशन',fluency:'फ्लुएंसी लैब',studyplan:'स्टडी प्लान',formulas:'फॉर्मूला कार्ड्स',drive:'मॉक ड्राइव',certificates:'सर्टिफिकेट',portfolio:'पोर्टफोलियो',overview:'अवलोकन',practice:'अभ्यास',career:'करियर',social:'कम्युनिटी',manage:'प्रबंधन',content:'सामग्री'}
};
function t(k){return (I18N[state.lang]&&I18N[state.lang][k])||I18N.en[k]||k}
window.toggleLang=()=>{
  const next=state.lang==='hi'?'en':'hi';
  if(next==='hi'&&supabaseClient&&!state.user?.authenticated&&!localStorage.getItem(TRANSLATION_CONSENT_KEY)){
    toast('Sign in to translate all page content with the configured AI service.','info',4000);
    return;
  }
  if(next==='hi'&&supabaseClient&&state.user?.authenticated&&!localStorage.getItem(TRANSLATION_CONSENT_KEY)){
    if(!confirm('Hindi translation sends visible page text to the configured Gemini service. Continue?'))return;
    localStorage.setItem(TRANSLATION_CONSENT_KEY,'1');
  }
  state.lang=next;persist();render(true);
  toast(state.lang==='hi'?'भाषा: हिंदी':'Language: English','info',1400);
};


/* ── Toast ── */
function toast(msg,kind='info',ms=3400){
  const icons={info:'ℹ',success:'✓',error:'✕',warn:'⚠',sparkle:'✨'};
  const colors={info:'border-brand-500/50 text-brand-300',success:'border-good/50 text-good',error:'border-bad/50 text-bad',warn:'border-warn/50 text-warn',sparkle:'border-lime/50 text-lime'};
  const el=document.createElement('div');
  el.className=`toast-enter card px-4 py-3 text-sm flex items-center gap-3 ${colors[kind]||colors.info} shadow-soft`;
  el.innerHTML=`<span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold border border-current shrink-0">${icons[kind]||icons.info}</span><span class="text-slate-200 flex-1">${esc(msg)}</span>`;
  $('#toasts').appendChild(el);
  setTimeout(()=>{el.style.transition='all .3s';el.style.opacity='0';el.style.transform='translateX(20px)';setTimeout(()=>el.remove(),320)},ms);
}


/* ── Modal ── */
function modal({title,body,actions=[],size='md'}){
  const sizes={sm:'max-w-md',md:'max-w-lg',lg:'max-w-2xl',xl:'max-w-4xl',full:'max-w-6xl'};
  const el=document.createElement('div');
  el.className='fixed inset-0 z-[90] flex items-center justify-center p-4';
  el.style.animation='fadeIn .3s ease both';
  el.innerHTML=`<div class="absolute inset-0 bg-black/75 backdrop-blur-sm" data-close></div>
    <div class="relative card ${sizes[size]} w-full shadow-soft max-h-[92vh] overflow-hidden flex flex-col" style="animation:slideUp .4s cubic-bezier(.16,1,.3,1) both">
      <div class="p-5 border-b border-ink-650 flex items-center justify-between shrink-0">
        <h3 class="text-white font-bold text-lg">${esc(title)}</h3>
        <button data-close class="text-slate-400 hover:text-white text-2xl leading-none px-2 -mr-2">×</button>
      </div>
      <div class="p-6 overflow-y-auto flex-1">${body}</div>
      ${actions.length?`<div class="p-5 border-t border-ink-650 flex gap-3 justify-end shrink-0 bg-ink-850/60">${actions.map((a,i)=>`<button data-action="${i}" class="${a.class||'btn-ghost card-flat px-5 py-2.5 rounded-xl text-sm text-slate-200'}">${a.label}</button>`).join('')}</div>`:''}
    </div>`;
  $('#modalRoot').appendChild(el);
  const close=()=>el.remove();
  el.addEventListener('click',e=>{
    if(e.target.hasAttribute('data-close'))return close();
    const i=e.target.closest('[data-action]')?.getAttribute('data-action');
    if(i!==null&&i!==undefined){const a=actions[+i];if(a.onClick&&a.onClick()===false)return;close()}
  });
  return{close};
}
function confirmDialog(msg,onYes,opts={}){modal({title:opts.title||'Confirm',body:`<p class="text-slate-300 leading-relaxed">${esc(msg)}</p>`,actions:[{label:'Cancel',class:'btn-ghost card-flat px-5 py-2.5 rounded-xl text-sm text-slate-300'},{label:opts.yesLabel||'Confirm',class:'btn-primary text-white px-5 py-2.5 rounded-xl text-sm font-semibold',onClick:onYes}]})}


/* ── Confetti ── */
function confetti(n=60){
  const cols=['#7c5cff','#60a5fa','#34d399','#fbbf24','#f472b6','#22d3ee','#c4b5fd'];
  for(let i=0;i<n;i++){
    const p=document.createElement('div');p.className='confetti';
    const s=6+Math.random()*8;
    p.style.cssText=`width:${s}px;height:${s}px;background:${cols[i%cols.length]};left:50%;top:38%;border-radius:${Math.random()>.5?'50%':'2px'}`;
    p.style.setProperty('--tx',(Math.random()-.5)*600+'px');
    p.style.setProperty('--ty',(300+Math.random()*500)+'px');
    p.style.setProperty('--rot',(Math.random()*720-360)+'deg');
    p.style.animation=`confettiFall ${1.2+Math.random()*1}s cubic-bezier(.2,.6,.3,1) forwards`;
    $('#fxRoot').appendChild(p);
    setTimeout(()=>p.remove(),2400);
  }
}


/* ── Ripple ── */
document.addEventListener('click',e=>{
  const b=e.target.closest('.btn-primary,.btn-ghost,.ripple-on');
  if(!b)return;
  const r=b.getBoundingClientRect();
  const rip=document.createElement('span');rip.className='ripple';
  const size=Math.max(r.width,r.height);
  rip.style.cssText=`width:${size}px;height:${size}px;left:${e.clientX-r.left-size/2}px;top:${e.clientY-r.top-size/2}px`;
  b.appendChild(rip);
  setTimeout(()=>rip.remove(),700);
});


/* ── Number counter ── */
function animateNum(el,to,dur=900,decimals=0){
  const start=performance.now();
  const tick=now=>{
    const p=Math.min(1,(now-start)/dur);
    const eased=1-Math.pow(1-p,3);
    const v=to*eased;
    el.textContent=decimals?v.toFixed(decimals):Math.round(v).toLocaleString();
    if(p<1)requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}


/* ── Tilt ── */
function attachTilt(){
  $$('.tilt').forEach(card=>{
    if(card.dataset.tiltBound)return;
    card.dataset.tiltBound='1';
    card.addEventListener('mousemove',e=>{
      const r=card.getBoundingClientRect();
      const x=(e.clientX-r.left)/r.width-.5;
      const y=(e.clientY-r.top)/r.height-.5;
      card.style.transform=`perspective(900px) rotateY(${x*6}deg) rotateX(${-y*6}deg) translateZ(6px)`;
    });
    card.addEventListener('mouseleave',()=>{card.style.transform=''});
  });
}


/* ── Reveals ── */
let _observer=null;
function attachReveals(){
  if(_observer)_observer.disconnect();
  _observer=new IntersectionObserver(entries=>{
    entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('visible');_observer.unobserve(e.target)}});
  },{threshold:.08,rootMargin:'0px 0px -40px 0px'});
  $$('.reveal').forEach(el=>_observer.observe(el));
}

function learningLessonsForRole(role=state.user?.targetRole||''){
  if(!role)return LESSONS;
  let ids;
  if(/software|engineer|developer|programmer/i.test(role))ids=['l1','l2','l3','l4','l5','l6','l7','l8','l9'];
  else if(/data analyst/i.test(role))ids=['l1','l2','l3','l6','l9','l11'];
  else if(/product manager/i.test(role))ids=['l1','l2','l3','l9','l10'];
  else if(/account|finance|credit|tax|audit/i.test(role))ids=['l1','l2','l3','l9','l11'];
  else if(/marketing|brand|copywriter|creative/i.test(role))ids=['l2','l3','l9','l12'];
  else if(/ux|design/i.test(role))ids=['l2','l3','l9','l12','l13'];
  else if(/human resources/i.test(role))ids=['l2','l3','l9','l10'];
  else ids=['l1','l2','l3','l9'];
  return LESSONS.filter(lesson=>ids.includes(lesson.id));
}

}

async function loadAuthenticatedUser(authUser){
  const{data:profile,error:profileError}=await supabaseClient.from('profiles').select('display_name,field_of_study,target_role').eq('id',authUser.id).single();
  if(profileError)throw new Error(`Could not load your profile: ${profileError.message}`);

    role:'student',batch:'Student',avatar:ini(profile.display_name||authUser.email||'S'),fieldOfStudy:profile.field_of_study||'',
    targetRole:profile.target_role||'',targetSalary:profile.target_salary||'',authenticated:true};
  state.user=user;
  const{data:cloudState,error:stateError}=await supabaseClient.from('app_state').select('state').eq('user_id',authUser.id).maybeSingle();
  if(stateError)throw new Error(`Could not load your saved progress: ${stateError.message}`);
  if(cloudState?.state)Object.assign(state,cloudState.state);
  else{
    state.attempts=[];
    state.lessonProgress={};
    state.bookmarks={};
    state.interviews=[];
    state.interviewsDone=0;
    state.codeSubs=[];
    state.badges=[];
    state.activity=[];
    state.jobs=JOBS.map(job=>({...job,saved:false,applied:false}));
  }
  user.targetSalary=state.targetSalary||'';
  state.user=user;
  state.view=user.targetRole?'dashboard':'career-setup';
  render(true);
}

async function initializeApp(){
  if(!supabaseClient){
    if(state.user?.authenticated)state.user=null;
    render(false);
    return;
  }
  const{data,error}=await supabaseClient.auth.getSession();
  if(error){toast(`Could not restore your sign-in: ${error.message}`,'error',6000);render(false);return}
  if(data.session){
    try{await loadAuthenticatedUser(data.session.user)}
    catch(e){state.user=null;render(false);toast(e.message,'error',6000)}
  }else render(false);
  supabaseClient.auth.onAuthStateChange((event,session)=>{
    if(event==='SIGNED_OUT'){state.user=null;state.view='login';render(true)}
  });
}

function computeReadiness(){
  const att=state.attempts;
  const tS=att.reduce((a,x)=>a+x.score,0),tQ=att.reduce((a,x)=>a+x.total,0);
  const mcq=tQ?(tS/tQ)*100:0;
  let done=0,tot=0;
  for(const l of learningLessonsForRole())for(const m of l.modules){tot++;if(state.lessonProgress[l.id]?.[m.id])done++}
  const learn=tot?(done/tot)*100:0;
  const solved=state.codeSubs.filter(s=>s.status==='passed').length;
  const coding=Math.min(100,(solved/CODING_PROBLEMS.length)*100);
  const interviewCount=state.interviews.filter(i=>Number.isFinite(i.overall)).length;
  const intv=interviewCount?state.interviews.reduce((sum,i)=>sum+i.overall,0)/interviewCount:0;
  const resume=state.analyzer?.score;
  const role=state.user?.targetRole||'';
  const codingRelevant=/engineer|developer|programmer|software/i.test(role);
  const raw=[
    {key:'mcq',label:'MCQ accuracy',value:Math.round(mcq),weight:40,available:tQ>0},
    {key:'learn',label:'Learning progress',value:Math.round(learn),weight:20,available:done>0},
    {key:'coding',label:'Coding practice',value:Math.round(coding),weight:20,available:codingRelevant},
    {key:'intv',label:'Mock interviews',value:Math.round(intv),weight:10,available:interviewCount>0},
    {key:'resume',label:'Resume quality',value:Math.round(resume||0),weight:10,available:Number.isFinite(resume)}
  ].filter(part=>part.available);
  const totalWeight=raw.reduce((sum,part)=>sum+part.weight,0);
  const score=totalWeight?Math.round(raw.reduce((sum,part)=>sum+part.value*part.weight,0)/totalWeight):0;
  return{score:clamp(score,0,100),parts:raw.map(part=>({...part,weight:Math.round(part.weight/totalWeight*100)}))};
}
function topicStats(){
  const agg={};
  for(const a of state.attempts)for(const[t,v]of Object.entries(a.topics||{})){
    agg[t]=agg[t]||{c:0,t:0};agg[t].c+=v.c;agg[t].t+=v.t;
  }
  return Object.entries(agg).map(([topic,v])=>({topic,correct:v.c,total:v.t,pct:v.t?Math.round(v.c/v.t*100):0})).sort((a,b)=>b.pct-a.pct);
}
function computePoints(){
  let p=0;
  for(const a of state.attempts)p+=a.score*10;
  for(const l of learningLessonsForRole())for(const m of l.modules)if(state.lessonProgress[l.id]?.[m.id])p+=15;
  p+=state.codeSubs.filter(s=>s.status==='passed').length*50;
  p+=state.interviewsDone*40;
  if(state.analyzer)p+=30;
  return p;
}
function computeStreak(){
  const days=new Set(state.activity.map(item=>new Date(item.at).toLocaleDateString('en-CA')).filter(day=>day!=='Invalid Date'));
  const today=new Date();today.setHours(0,0,0,0);
  const yesterday=new Date(today);yesterday.setDate(yesterday.getDate()-1);
  let cursor=days.has(today.toLocaleDateString('en-CA'))?today:yesterday;
  if(!days.has(cursor.toLocaleDateString('en-CA')))return 0;
  let streak=0;
  while(days.has(cursor.toLocaleDateString('en-CA'))){streak++;cursor.setDate(cursor.getDate()-1)}
  return streak;
}
function computeLeaderboard(){
  const myPts=computePoints();
  const me={name:state.user?.name||'You',batch:state.user?.batch||'—',points:myPts,solved:state.codeSubs.filter(s=>s.status==='passed').length,streak:computeStreak(),avatar:state.user?.avatar||ini(state.user?.name||'You'),isMe:true};
  return [...LEADERBOARD_SEED,me].sort((a,b)=>b.points-a.points);
}
function isLessonComplete(l){return l.modules.every(m=>state.lessonProgress[l.id]?.[m.id])}

  render(transition);
  window.scrollTo({top:0,behavior:'instant'});

}

function render(transition){
  const root=$('#root');
  const sidebarScrollTop=$('#sidebar')?.scrollTop||0;
  const view=VIEWS[state.view]||viewDashboard;
  const html=view();
  root.innerHTML=html;
  requestAnimationFrame(()=>{
    const sidebar=$('#sidebar');
    if(sidebar)sidebar.scrollTop=sidebarScrollTop;
    attachTilt();
    attachReveals();
    animateCounters();
    animateRings();
    bindSidebarResize();
    translateCurrentView();
  });
  persist();
}
function animateCounters(){
  $$('[data-count]').forEach(el=>{
    if(el.dataset.countDone)return;
    el.dataset.countDone='1';
    const to=parseFloat(el.getAttribute('data-count'));
    const dec=parseInt(el.getAttribute('data-dec')||'0');
    animateNum(el,to,900,dec);
  });
}
function animateRings(){
  setTimeout(()=>{
    $$('[data-ring]').forEach(el=>{
      const pct=+el.getAttribute('data-ring');
      const r=+el.getAttribute('data-r');
      const c=2*Math.PI*r;
      el.style.strokeDashoffset=c*(1-pct/100);
    });
    $$('[data-bar]').forEach(el=>{el.style.width=el.getAttribute('data-bar')+'%'});
  },80);
}

function bindSidebarResize(){
  const h=$('#sbHandle');
  if(!h)return;
  const sb=$('#sidebar');
  let dragging=false,startX=0,startW=0;
  const down=e=>{dragging=true;startX=e.clientX;startW=state.sidebarWidth;h.classList.add('dragging');document.body.style.cursor='col-resize';document.body.style.userSelect='none'};
  const move=e=>{if(!dragging)return;const delta=e.clientX-startX;const w=clamp(startW+delta,200,340);sb.style.width=w+'px';state.sidebarWidth=w};
  const up=()=>{if(!dragging)return;dragging=false;h.classList.remove('dragging');document.body.style.cursor='';document.body.style.userSelect='';persist()};
  h.addEventListener('mousedown',down);
  window.addEventListener('mousemove',move);
  window.addEventListener('mouseup',up);
}

window.onSearchInput=v=>{

  const results=[];
  if(!q){
    LESSONS.slice(0,3).forEach(l=>results.push({type:'Lesson',label:l.title,action:`go('lesson',{id:'${l.id}'})`}));
    COMPANIES.slice(0,3).forEach(c=>results.push({type:'Company',label:c.name,action:`go('company',{id:'${c.id}'})`}));
    CODING_PROBLEMS.slice(0,3).forEach(p=>results.push({type:'Problem',label:p.title,action:`go('code',{problemId:'${p.id}'})`}));
    BADGES.slice(0,2).forEach(b=>results.push({type:'Badge',label:b.name,action:`go('badges')`}));
  }else{
    LESSONS.forEach(l=>{if(l.title.toLowerCase().includes(q)||l.desc.toLowerCase().includes(q))results.push({type:'Lesson',label:l.title,action:`go('lesson',{id:'${l.id}'})`})});
    COMPANIES.forEach(c=>{if(c.name.toLowerCase().includes(q)||c.topics.join(' ').toLowerCase().includes(q))results.push({type:'Company',label:c.name,action:`go('company',{id:'${c.id}'})`})});
    CODING_PROBLEMS.forEach(p=>{if(p.title.toLowerCase().includes(q)||p.topic.toLowerCase().includes(q))results.push({type:'Problem',label:p.title,action:`go('code',{problemId:'${p.id}'})`})});
    BADGES.forEach(b=>{if(b.name.toLowerCase().includes(q))results.push({type:'Badge',label:b.name,action:`go('badges')`})});
    QUESTIONS.slice(0,40).forEach(qq=>{if(qq.topic.toLowerCase().includes(q)||qq.q.toLowerCase().includes(q))results.push({type:'Question',label:qq.q.slice(0,60),action:null})});
  }
  const el=$('#searchResults');
  if(el){
    el.innerHTML=results.length?results.slice(0,10).map((r,i)=>`
      <button onclick="${r.action||`toast('Question preview coming soon')`};closeSearch()" class="w-full text-left flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-ink-700 text-sm" style="animation:slideUp .3s ${i*20}ms both">

      `<div class="text-center text-slate-500 text-sm py-10"><div class="text-3xl mb-2 opacity-40">🔍</div>No results for "${esc(v)}"</div>`;
  }
};

window.setAuthMode=mode=>{
  const signup=mode==='signup';
  $('#signupNameWrap')?.classList.toggle('hidden',!signup);
  $('#authName')?.toggleAttribute('required',signup);
  const password=$('#authPassword');
  if(password)password.autocomplete=signup?'new-password':'current-password';
  if($('#authSubmit'))$('#authSubmit').textContent=signup?'Create account':'Sign in';
  if($('#authModeToggle')){
    $('#authModeToggle').textContent=signup?'Already registered? Sign in':'New student? Create an account';
    $('#authModeToggle').onclick=()=>setAuthMode(signup?'signin':'signup');
  }
};
window.submitAuth=async event=>{
  event.preventDefault();
  if(!supabaseClient){toast('Supabase is not configured. See README.md.','error');return}
  const signup=!$('#signupNameWrap').classList.contains('hidden');
  const email=$('#authEmail').value.trim();
  const password=$('#authPassword').value;
  const name=$('#authName').value.trim();
  const button=$('#authSubmit');
  button.disabled=true;
  try{
    if(signup){
      if(!name){toast('Enter your name to create an account.','error');return}
      const{data,error}=await supabaseClient.auth.signUp({email,password,options:{data:{display_name:name},emailRedirectTo:location.href.split('#')[0]}});
      if(error)throw error;
      if(!data.session){toast('Check your email to confirm your account, then sign in.','success',6000);setAuthMode('signin');return}
      await loadAuthenticatedUser(data.user);
      toast('Account created. Choose your target role to personalize your plan.','success',5000);
    }else{
      const{data,error}=await supabaseClient.auth.signInWithPassword({email,password});
      if(error)throw error;
      await loadAuthenticatedUser(data.user);
      toast(`Welcome, ${state.user.name.split(' ')[0]}!`,'success');
    }
  }catch(error){toast(`Sign-in failed: ${error.message}`,'error',6000)}
  finally{button.disabled=false}
};
window.signIn=id=>{
  const demo=USERS.find(u=>u.id===id);
  if(!demo){toast('Demo account not found.','error');return}
  state.user={...demo,targetRole:demo.role==='student'?'Software Engineer':'',fieldOfStudy:demo.role==='student'?'Technology':''};
  go('dashboard');
  toast(`Welcome, ${state.user.name.split(' ')[0]}!`,'success');
};
window.signOut=()=>confirmDialog('Sign out of SkillPath?',async()=>{
  if(state.user?.authenticated){
    const{error}=await supabaseClient.auth.signOut();
    if(error){toast(`Could not sign out: ${error.message}`,'error');return}
  }
  state.user=null;go('login');toast('Signed out','info')
},{yesLabel:'Sign out'});

        <h1 class="text-3xl font-black text-white">Choose your placement goal</h1>
        <p class="text-slate-400 mt-2">We’ll use this to tailor your interview practice and AI recommendations. You can change it later.</p>
      </div>
      <form class="card p-6 space-y-5" onsubmit="saveCareerGoal(event)">

            <option value="">Choose a role…</option>
            ${CAREER_GOALS.map(g=>`<option value="${esc(g.role)}" ${selected?.role===g.role?'selected':''}>${esc(g.role)} — ${esc(g.field)}</option>`).join('')}

        </div>

}
window.saveCareerGoal=async event=>{
  event.preventDefault();
  const goal=CAREER_GOALS.find(g=>g.role===$('#careerGoal').value);
  if(!goal){toast('Choose a target role first.','error');return}
  const salary=$('#targetSalary').value.trim();
  if(state.user?.authenticated){
    const{error}=await supabaseClient.from('profiles').update({
      field_of_study:goal.field,target_role:goal.role,target_salary:salary,updated_at:new Date().toISOString()
    }).eq('id',state.user.id);
    if(error){toast(`Could not save your target role: ${error.message}`,'error',6000);return}
  }
  state.user={...state.user,fieldOfStudy:goal.field,targetRole:goal.role,targetSalary:salary};
  go('dashboard');
  toast(`Your plan is now focused on ${goal.role}.`,'success',3500);
};

        </div>

window.exportData=()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='skillpath-data.json';a.click();toast('Data exported','success')};
window.importData=()=>{const i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);Object.assign(state,d);persist();render(true);toast('Data imported','success')}catch(err){toast('Invalid JSON','error')}};r.readAsText(f)};i.click()};
window.resetData=()=>confirmDialog('Reset all data to seeded demo?',()=>{localStorage.removeItem(STORAGE_KEY);const u=state.user;state=freshState();state.user=u;go('dashboard');toast('Data reset','success')},{yesLabel:'Reset'});


/* ════════════════════════════════════════════════════════════════
   VIEW: DASHBOARD
   ════════════════════════════════════════════════════════════════ */
function viewDashboard(){
  const r=computeReadiness();
  const points=computePoints();
  const streak=computeStreak();
  const topics=topicStats();
  const weak=topics.slice(-3).reverse();
  const board=computeLeaderboard();
  const myRank=board.findIndex(x=>x.isMe)+1;
  const recent=state.activity.slice(0,6);
  const trend=state.attempts.slice(-8);
  state.aiActions=state.aiActions||[];
  const averageTestScore=state.attempts.length?Math.round(state.attempts.reduce((sum,a)=>sum+a.score/a.total,0)/state.attempts.length*100):0;


  const W=560,H=140,padX=30,padY=22;
  const pts=trend.map((a,i)=>{
    const x=padX+(i/Math.max(1,trend.length-1))*(W-padX*2);
    const y=H-padY-(a.score/a.total)*(H-padY*2);
    return[x,y];
  });
  const linePath=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const areaPath=pts.length?`${linePath} L ${pts[pts.length-1][0]} ${H-padY} L ${pts[0][0]} ${H-padY} Z`:'';


  const ring=(pct,size=180,stroke=13)=>{
    const rr=(size-stroke)/2,c=2*Math.PI*rr;
    return`<svg width="${size}" height="${size}" class="block drop-shadow-[0_0_32px_rgba(124,92,255,0.4)]">
      <defs><linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#e0d9ff"/><stop offset="35%" stop-color="#a78bfa"/>
        <stop offset="70%" stop-color="#7c5cff"/><stop offset="100%" stop-color="#60a5fa"/>
      </linearGradient></defs>
      <circle cx="${size/2}" cy="${size/2}" r="${rr}" stroke="#1a2138" stroke-width="${stroke}" fill="none"/>
      <circle cx="${size/2}" cy="${size/2}" r="${rr}" class="ring-fill" stroke-width="${stroke}" fill="none"
        stroke-dasharray="${c}" stroke-dashoffset="${c}" stroke-linecap="round"
        data-ring="${pct}" data-r="${rr}" style="transform:rotate(-90deg);transform-origin:${size/2}px ${size/2}px"/>
    </svg>`;
  };


  return layout(`
    <div class="space-y-6">
      <div class="flex flex-wrap items-end justify-between gap-4 reveal">
        <div>
          <div class="text-slate-500 text-xs tracking-wider uppercase font-semibold">${new Date().toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long'})}</div>
          <h1 class="text-3xl md:text-4xl font-black text-white mt-1.5 tracking-tight">Hey ${esc(state.user.name.split(' ')[0])} 👋</h1>
          <p class="text-slate-400 text-sm mt-1.5">Here's your placement readiness snapshot for <span class="text-slate-200 font-medium">${esc(state.user.batch)}</span>.</p>
        </div>
        <div class="flex gap-2 flex-wrap">
          <button onclick="go('career-setup')" class="btn-ghost card-flat text-slate-200 text-sm font-semibold px-4 py-2.5 rounded-xl">${esc(state.user.targetRole||'Choose target role')}</button>
          <button onclick="go('tests')" class="btn-primary text-white text-sm font-semibold px-5 py-2.5 rounded-xl">⚡ Take a test</button>
          <button onclick="go('interview')" class="btn-ghost card-flat text-slate-200 text-sm font-semibold px-5 py-2.5 rounded-xl">🎤 Mock interview</button>
          ${/engineer|developer|programmer|software/i.test(state.user.targetRole||'')?`<button onclick="go('code')" class="btn-ghost card-flat text-slate-200 text-sm font-semibold px-5 py-2.5 rounded-xl hidden md:inline-flex">💻 Code</button>`:''}
        </div>
      </div>


      <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 md:gap-4 stagger">
        ${[
          {i:'🔥',l:'Day streak',v:streak,s:'Personal best: 21',grad:'from-orange-500/25 to-red-500/10',ic:'text-orange-400'},
          {i:'⭐',l:'Total points',v:points,s:`Rank #${myRank} in batch`,grad:'from-amber-500/25 to-yellow-500/10',ic:'text-amber-400'},
          {i:'🏅',l:'Badges earned',v:state.badges.length,s:`${BADGES.length-state.badges.length} to unlock`,grad:'from-brand-500/25 to-sky-500/10',ic:'text-brand-300'},
          {i:'📝',l:'Tests taken',v:state.attempts.length,s:state.attempts.length?`Avg ${averageTestScore}%`:'No tests completed',grad:'from-sky-500/25 to-cyan-500/10',ic:'text-sky-400'}
        ].map(k=>`
          <div class="card p-4 relative overflow-hidden group card-hover tilt">
            <div class="absolute inset-0 bg-gradient-to-br ${k.grad} opacity-60 group-hover:opacity-100 transition"></div>
            <div class="relative tilt-inner">
              <div class="flex items-center justify-between">
                <span class="text-2xl ${k.ic} group-hover:scale-110 transition">${k.i}</span>
                <span class="text-[10px] text-slate-500 uppercase tracking-wider font-semibold">${k.l}</span>
              </div>
              <div class="text-2xl md:text-3xl font-black text-white mt-3 tabular-nums" data-count="${k.v}">0</div>
              <div class="text-[11px] text-slate-500 mt-1">${k.s}</div>
            </div>
          </div>`).join('')}
      </div>


      <div class="grid lg:grid-cols-3 gap-5">
        <div class="card p-6 lg:col-span-1 flex flex-col items-center text-center relative overflow-hidden reveal">
          <div class="absolute -top-16 -right-16 w-52 h-52 rounded-full bg-brand-500/25 blur-3xl pointer-events-none"></div>
          <div class="relative">
            ${ring(r.score)}
            <div class="absolute inset-0 flex flex-col items-center justify-center">
              <div class="text-5xl md:text-6xl font-black text-white tabular-nums" data-count="${r.score}">0</div>
              <div class="text-[10px] text-slate-500 uppercase tracking-[0.2em] mt-2 font-bold">Readiness</div>
            </div>
          </div>
          <div class="mt-6 text-sm text-slate-300 max-w-xs relative z-10">
            ${r.score>=75?'<span class="text-good font-bold">You are interview ready.</span> Keep sharpening weak topics.':
              r.score>=50?'On track. Focus on your <span class="text-warn font-semibold">weak topics</span> below.':
              'Just getting started — complete lessons and take a test.'}
          </div>
          <button onclick="openReadinessModal()" class="mt-5 text-xs text-brand-400 hover:text-brand-300 font-medium relative z-10">How is this calculated? →</button>
        </div>


        <div class="card p-6 lg:col-span-2 reveal">
          <div class="flex items-center justify-between mb-5">
            <h3 class="text-white font-bold">Score breakdown</h3>
            <span class="text-[10px] text-slate-500 uppercase tracking-wider font-semibold">${r.parts.length?'Based on recorded activity':'No completed activities yet'}</span>
          </div>
          <div class="space-y-4">
            ${r.parts.map(p=>`
              <div>
                <div class="flex justify-between text-xs mb-2">
                  <span class="text-slate-300">${p.label} <span class="text-slate-600">· ${p.weight}% weight</span></span>
                  <span class="text-slate-400 tabular-nums font-semibold">${p.value}%</span>
                </div>
                <div class="h-2 bg-ink-700 rounded-full overflow-hidden">
                  <div data-bar="${p.value}" class="h-full rounded-full bg-gradient-to-r from-brand-500 to-sky-500 transition-all duration-1000 ease-out" style="width:0"></div>
                </div>
              </div>`).join('')}
            ${!r.parts.length?'<p class="text-sm text-slate-500">Complete role-relevant practice to see a score breakdown. Missing data is not counted as completed work.</p>':''}
          </div>
        </div>
      </div>


      <div class="grid lg:grid-cols-3 gap-5">
        <div class="card p-6 lg:col-span-2 reveal">
          <div class="flex items-center justify-between mb-5">
            <h3 class="text-white font-bold">Performance trend</h3>
            <button onclick="go('analytics')" class="text-xs text-brand-400 hover:text-brand-300 font-medium">Full analytics →</button>
          </div>
          ${trend.length<2?`<div class="text-slate-500 text-sm py-12 text-center">Take at least two tests to see your trend.</div>`:`
          <svg viewBox="0 0 ${W} ${H}" class="w-full h-40">
            <defs>
              <linearGradient id="lg" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#60a5fa"/></linearGradient>
              <linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#7c5cff" stop-opacity=".4"/><stop offset="100%" stop-color="#7c5cff" stop-opacity="0"/></linearGradient>
            </defs>
            ${[0,50,100].map(p=>{const y=H-padY-(p/100)*(H-padY*2);
              return`<line x1="${padX}" y1="${y}" x2="${W-padX}" y2="${y}" stroke="#1a2138" stroke-width="1" stroke-dasharray="2,4"/>
                     <text x="4" y="${y+3}" fill="#5c6789" font-size="9" font-family="Inter" font-weight="600">${p}%</text>`}).join('')}
            <path d="${areaPath}" fill="url(#ag)"/>
            <path d="${linePath}" fill="none" stroke="url(#lg)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="stroke-dasharray:2000;stroke-dashoffset:2000;animation:dash 1.8s cubic-bezier(.16,1,.3,1) forwards"/>
            ${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="4.5" fill="#080b15" stroke="#7c5cff" stroke-width="2.5" style="animation:pop .4s ${0.3+i*.1}s both"/>`).join('')}
          </svg>`}
        </div>


        <div class="card p-6 reveal">
          <h3 class="text-white font-bold mb-4">Topic accuracy</h3>
          <div class="space-y-3.5">
            ${topics.slice(0,6).map(t=>`
              <div>
                <div class="flex justify-between text-xs mb-1.5">
                  <span class="text-slate-300 truncate pr-2">${esc(t.topic)}</span>
                  <span class="text-slate-400 tabular-nums font-semibold">${t.pct}%</span>
                </div>
                <div class="h-2 bg-ink-700 rounded-full overflow-hidden">
                  <div data-bar="${t.pct}" class="h-full rounded-full ${t.pct>=75?'bg-good':t.pct>=50?'bg-warn':'bg-bad'} transition-all duration-1000" style="width:0"></div>
                </div>
              </div>`).join('')}
          </div>
        </div>
      </div>


      <div class="grid lg:grid-cols-3 gap-5">
        <div class="card p-6 reveal">
          <div class="flex items-center justify-between mb-4">
            <h3 class="text-white font-bold">Next best actions</h3>
            <button onclick="loadAIRecommendations()" class="text-[10px] text-brand-300 uppercase tracking-wider font-bold hover:text-white">✨ Ask Gemini</button>
          </div>
          <div class="space-y-3 stagger">
            ${state.aiActions.length?state.aiActions.map((action,i)=>`
              <button onclick="go('${['learning','tests','interview','resume','analyzer','code','companies','jobs','studyplan','formulas'].includes(action.view)?action.view:'studyplan'}')" class="w-full card-flat p-3 flex items-start gap-3 hover:border-brand-500/50 transition text-left group">
                <div class="w-7 h-7 rounded-lg bg-brand-500/20 text-brand-300 flex items-center justify-center text-xs font-bold shrink-0">${i+1}</div>
                <div class="min-w-0"><div class="text-sm text-white">${esc(action.title)}</div><div class="text-[11px] text-slate-500 mt-0.5">${esc(action.reason)}</div></div>
              </button>`).join(''):weak.slice(0,3).map((w,i)=>`
              <button onclick="go('learning')" class="w-full card-flat p-3 flex items-start gap-3 hover:border-brand-500/50 transition text-left group">
                <div class="w-7 h-7 rounded-lg bg-brand-500/20 text-brand-300 flex items-center justify-center text-xs font-bold shrink-0 group-hover:scale-110 transition">${i+1}</div>
                <div class="min-w-0">
                  <div class="text-sm text-white">Practice <span class="text-brand-300 font-semibold">${esc(w.topic)}</span></div>
                  <div class="text-[11px] text-slate-500 mt-0.5">Currently at ${w.pct}% accuracy</div>
                </div>
              </button>`).join('')||`<div class="card-flat p-3 text-xs text-slate-400">Practice and test recommendations will be based on your ${esc(state.user.targetRole||'target role')} progress.</div>`}
            <button onclick="go('analyzer')" class="w-full card-flat p-3 flex items-start gap-3 hover:border-sky-500/50 transition text-left group">
              <div class="w-7 h-7 rounded-lg bg-sky-500/20 text-sky-400 flex items-center justify-center text-xs group-hover:scale-110 transition">🔍</div>
              <div class="min-w-0"><div class="text-sm text-white">Run resume analyzer</div><div class="text-[11px] text-slate-500 mt-0.5">ATS feedback & rewrites</div></div>
            </button>
          </div>
        </div>


        <div class="card p-6 reveal">
          <div class="flex items-center justify-between mb-4">
            <h3 class="text-white font-bold">Recent activity</h3>
            <span class="text-[10px] text-slate-500 uppercase tracking-wider font-bold">Live</span>
          </div>
          <div class="space-y-3 stagger">
            ${recent.slice(0,5).map(a=>`
              <div class="flex items-start gap-3">
                <div class="w-8 h-8 rounded-lg bg-gradient-to-br ${a.color} flex items-center justify-center text-sm shrink-0">${a.icon}</div>
                <div class="min-w-0 flex-1">
                  <div class="text-xs text-slate-300 leading-relaxed">${a.text}</div>
                  <div class="text-[10px] text-slate-600 mt-0.5">${rel(a.at)}</div>
                </div>
              </div>`).join('')}
          </div>
        </div>


        <div class="card p-6 reveal">
          <h3 class="text-white font-bold mb-4">Upcoming</h3>
          <div class="space-y-3 stagger">
            <div class="card-flat p-4 text-sm text-slate-400">No placement-cell events are connected to this account yet. We will show scheduled items here when an organizer adds them.</div>
            <button onclick="go('tests')" class="w-full btn-ghost card-flat p-3 text-left text-sm text-brand-300">Start a practice test for ${esc(state.user.targetRole||'your target role')} →</button>
          </div>
        </div>
      </div>
    </div>
  `);
}

window.loadAIRecommendations=async()=>{
  try{
    const result=await requestAI('next_actions',{role:state.user?.targetRole||'student',field:state.user?.fieldOfStudy||'general',
      progress:{readiness:computeReadiness(),tests:state.attempts.length,topics:topicStats(),lessons:state.lessonProgress,
        interviews:state.interviews.map(item=>({overall:item.overall,type:item.type})),resumeScore:state.analyzer?.score||null}});
    if(!Array.isArray(result?.actions)||result.actions.length!==3||result.actions.some(action=>!action.title||!action.reason)){
      throw new Error('The AI returned an incomplete recommendation set.');
    }
    state.aiActions=result.actions;
    render(false);
  }catch(error){toast(`Could not create AI recommendations: ${error.message}`,'error',6000)}
};

window.openReadinessModal=()=>{

        ${r.parts.map(p=>`
          <div class="card-flat p-4">

              <span class="text-xs text-brand-300 font-bold">${p.weight}% weight</span>

            <div class="text-xs text-slate-500">Your score: <span class="text-slate-300 font-semibold">${p.value}%</span> · Contributes <span class="text-brand-300 font-semibold">${(p.value*p.weight/100).toFixed(1)}</span> points</div>

      </div>`,
    actions:[{label:'Got it',class:'btn-primary text-white px-5 py-2.5 rounded-xl text-sm font-semibold'}]
  });
};


/* ════════════════════════════════════════════════════════════════
   VIEW: LEARNING
   ════════════════════════════════════════════════════════════════ */
function viewLearning(){
  const lessons=learningLessonsForRole();
  let done=0,tot=0;
  for(const l of lessons)for(const m of l.modules){tot++;if(state.lessonProgress[l.id]?.[m.id])done++}
  const pct=Math.round(done/tot*100);


  return layout(`
    <div class="space-y-6">
      <div class="flex flex-wrap items-end justify-between gap-4 reveal">
        <div>
          <h1 class="text-2xl md:text-3xl font-black text-white tracking-tight">${t('learning')} Paths</h1>
          <p class="text-slate-400 text-sm mt-1">Role-focused modules for ${esc(state.user?.targetRole||'placement preparation')} across ${lessons.length} learning paths.</p>
        </div>
        <div class="card px-5 py-3 flex items-center gap-4">
          <div class="text-right">
            <div class="text-2xl font-black text-white tabular-nums" data-count="${pct}">0</div>
            <div class="text-[10px] text-slate-500 uppercase tracking-wider font-bold">Complete</div>
          </div>
          <div class="w-28 h-2 bg-ink-700 rounded-full overflow-hidden">
            <div data-bar="${pct}" class="h-full bg-gradient-to-r from-brand-500 to-sky-500 transition-all duration-1000" style="width:0"></div>
          </div>
        </div>
      </div>


      <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-5 stagger">
        ${lessons.map(l=>{
          const d=l.modules.filter(m=>state.lessonProgress[l.id]?.[m.id]).length;
          const tt=l.modules.length;
          const p=Math.round(d/tt*100);
          const bm=state.bookmarks[l.id];
          return`
          <div class="card overflow-hidden card-hover tilt reveal group">
            <div class="h-24 bg-gradient-to-br ${l.color} relative flex items-center justify-between px-5 overflow-hidden">
              <div class="absolute inset-0 bg-black/15 group-hover:bg-black/5 transition"></div>
              <span class="text-4xl drop-shadow-lg relative z-10 group-hover:scale-110 transition">${l.icon}</span>
              <button onclick="event.stopPropagation();toggleBookmark('${l.id}')" class="text-2xl relative z-10 transition ${bm?'text-warn drop-shadow-lg scale-110':'text-white/40 hover:text-warn'}">${bm?'★':'☆'}</button>
            </div>
            <div class="p-5 tilt-inner">
              <div class="text-[10px] text-brand-300 uppercase tracking-wider font-bold">${esc(l.cat)}</div>
              <h3 class="text-white font-bold mt-1.5 group-hover:text-brand-200 transition">${esc(l.title)}</h3>

              ${state.lessonProgress[l.id]?.[mod.id]?'✓ Completed':'Mark complete'}
            </button>
          </div>


          <div class="text-slate-300 leading-relaxed space-y-4 text-[15px]">
            ${mod.body.split('\n\n').map(pp=>{
              let html=esc(pp)
                .replace(/&lt;strong&gt;/g,'<strong class="text-white">').replace(/&lt;\/strong&gt;/g,'</strong>')
                .replace(/&lt;em&gt;/g,'<em class="text-brand-200 not-italic font-medium">').replace(/&lt;\/em&gt;/g,'</em>');

              :`<button onclick="go('lesson',{id:'${l.id}',mod:'${l.modules[modIdx+1].id}'})" class="btn-primary text-white px-5 py-2.5 rounded-lg text-sm font-semibold">Next module →</button>`}

window.toggleModuleDone=(lid,mid)=>{
  state.lessonProgress[lid]=state.lessonProgress[lid]||{};

  if(state.lessonProgress[lid][mid]){
    confetti(40);
    toast('Module complete! +15 points','success');

};

/* ════════════════════════════════════════════════════════════════
   TEST TAKING
   ════════════════════════════════════════════════════════════════ */
window.startTest=async catId=>{
  const fmap={quant:q=>q.cat==='Quantitative',logic:q=>q.cat==='Logical',verbal:q=>q.cat==='Verbal',tech:q=>q.cat==='Technical'};
  const names={quant:'Quantitative Aptitude',logic:'Logical Reasoning',verbal:'Verbal Ability',tech:state.user?.targetRole||'Technical — Core CS'};
  let pool=shuffle(QUESTIONS.filter(fmap[catId])).slice(0,Math.min(8,QUESTIONS.filter(fmap[catId]).length));
  if(supabaseClient&&state.user?.authenticated){
    toast(`Generating a ${state.user.targetRole||'career'}-focused test…`,'info',2500);
    try{
      const generated=await requestAI('generate_test',{role:state.user.targetRole||'entry-level professional',
        field:state.user.fieldOfStudy||'general',topic:names[catId],count:8});
      if(!Array.isArray(generated?.questions)||generated.questions.length<5)throw new Error('The AI returned too few test questions.');
      pool=generated.questions.map(q=>{
        if(typeof q.q!=='string'||!Array.isArray(q.options)||q.options.length!==4||
          !Number.isInteger(q.answerIndex)||q.answerIndex<0||q.answerIndex>3)throw new Error('A generated question had an invalid answer or option set.');
        return{q:q.q,opts:q.options,ans:q.answerIndex,topic:String(q.topic||names[catId]),cat:catId,explanation:String(q.explanation||'')};
      });
    }catch(error){toast(`AI test generation failed; using the built-in question set instead: ${error.message}`,'error',6000)}
  }
  const perQ=60;
  state.activeTest={catId,name:names[catId],questions:pool,answers:new Array(pool.length).fill(null),idx:0,secondsLeft:pool.length*perQ,total:pool.length*perQ,submitted:false,startedAt:Date.now(),tabSwitches:0};
  go('test-active');
  startTimer();
  toast('Test started. Good luck!','info',2000);
};
let _timer=null;
function startTimer(){
  clearInterval(_timer);
  _timer=setInterval(()=>{
    const t=state.activeTest;
    if(!t||t.submitted){clearInterval(_timer);return}
    t.secondsLeft--;
    if(t.secondsLeft<=0){t.secondsLeft=0;clearInterval(_timer);submitTest(true);return}
    const timerEl=$('#testTimer');
    if(timerEl){
      timerEl.textContent=fmtT(t.secondsLeft);
      timerEl.classList.toggle('text-bad',t.secondsLeft<60);
      timerEl.classList.toggle('text-white',t.secondsLeft>=60);
    }
    const bar=$('#testBar');
    if(bar)bar.style.width=(t.secondsLeft/t.total*100)+'%';
  },1000);
}
window.pickAnswer=i=>{state.activeTest.answers[state.activeTest.idx]=i;render(false)};
window.gotoQ=i=>{state.activeTest.idx=i;render(false)};
window.nextQ=()=>{if(state.activeTest.idx<state.activeTest.questions.length-1){state.activeTest.idx++;render(false)}};
window.prevQ=()=>{if(state.activeTest.idx>0){state.activeTest.idx--;render(false)}};
window.submitTest=auto=>{
  const t=state.activeTest;if(!t||t.submitted)return;
  if(!auto){
    const un=t.answers.filter(a=>a===null).length;
    if(un>0){confirmDialog(`You have ${un} unanswered question(s). Submit anyway?`,()=>doSubmit(),{yesLabel:'Submit'});return}
  }
  doSubmit();
};
function doSubmit(){
  const t=state.activeTest;if(!t||t.submitted)return;
  t.submitted=true;clearInterval(_timer);
  let score=0;const topics={};
  t.questions.forEach((q,i)=>{
    const ok=t.answers[i]===q.ans;
    if(ok)score++;
    topics[q.topic]=topics[q.topic]||{c:0,t:0};topics[q.topic].t++;if(ok)topics[q.topic].c++;
  });
  const timeSec=Math.round((Date.now()-t.startedAt)/1000);
  const attempt={id:'a'+uid(),testName:t.name+` — Set ${state.attempts.length+1}`,date:new Date().toISOString(),score,total:t.questions.length,timeSec,topics,tabSwitches:t.tabSwitches||0};
  state.attempts.push(attempt);
  t.result=attempt;
  const pct=Math.round(score/t.questions.length*100);
  if(pct>=90&&!state.badges.includes('b9')){state.badges.push('b9');setTimeout(()=>toast('🏅 Badge unlocked: Sharp Shooter','sparkle'),900)}
  if(pct===100&&!state.badges.includes('b11')){state.badges.push('b11');setTimeout(()=>toast('🏅 Badge unlocked: Perfect Run','sparkle'),1200)}
  if(pct>=70&&!state.badges.includes('b2')){state.badges.push('b2')}
  state.activity.unshift({type:'test',icon:'📝',color:'from-sky-500 to-cyan-600',text:`Scored <b>${pct}%</b> on ${t.name}`,at:new Date().toISOString(),id:uid()});
  if(pct>=70)confetti(60);
  render(false);
  toast(`Test submitted — ${score}/${t.questions.length} (${pct}%)`,pct>=70?'success':'info');
}
window.closeTest=()=>{state.activeTest=null;clearInterval(_timer);go('tests')};


function viewTestActive(){

  if(!t)return layout('<div class="text-slate-400">No active test.</div>');

    const a=t.result;
    const pct=Math.round(a.score/a.total*100);
    return layout(`
      <div class="max-w-3xl mx-auto space-y-6">

          </div>
        </div>


        <div class="card p-6 reveal">

            ${t.questions.map((q,i)=>{

                      <span class="text-slate-300 font-semibold">Explanation:</span> ${esc(q.exp)}
                    </div>
                  </div>
                </div>
              </div>`}).join('')}
          </div>
        </div>
      </div>
    `);
  }
  const q=t.questions[t.idx];
  const answered=t.answers.filter(a=>a!==null).length;
  return layout(`
    <div class="max-w-4xl mx-auto space-y-4">
      <div class="card p-4 sticky top-16 z-20 glass-nav reveal">
        <div class="flex items-center justify-between gap-3 flex-wrap">
          <div class="min-w-0">
            <div class="text-white font-bold truncate">${esc(t.name)}</div>
            <div class="text-xs text-slate-500 mt-0.5">Question ${t.idx+1} of ${t.questions.length} · ${answered} answered${t.tabSwitches?` · ⚠ ${t.tabSwitches} switches`:''}</div>
          </div>
          <div class="flex items-center gap-3">
            <div class="text-right">
              <div id="testTimer" class="text-xl font-mono font-black ${t.secondsLeft<60?'text-bad':'text-white'} tabular-nums">${fmtT(t.secondsLeft)}</div>
              <div class="text-[10px] text-slate-500 uppercase tracking-wider font-bold">Time left</div>
            </div>
            <button onclick="submitTest(false)" class="btn-primary text-white text-sm px-4 py-2 rounded-lg font-semibold">Submit</button>
          </div>

    </div>

}


/* ════════════════════════════════════════════════════════════════
   VIEW: ANALYTICS
   ════════════════════════════════════════════════════════════════ */
function viewAnalytics(){
  const topics=topicStats();
  const weak=topics.slice(-3).reverse();
  const attempts=state.attempts;
  const W=600,H=180,pad=30;
  const pts=attempts.map((a,i)=>{
    const x=pad+(i/Math.max(1,attempts.length-1))*(W-pad*2);
    const y=H-pad-(a.score/a.total)*(H-pad*2);
    return[x,y];
  });
  const path=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=pts.length?`${path} L ${pts[pts.length-1][0]} ${H-pad} L ${pts[0][0]} ${H-pad} Z`:'';
  return layout(`
    <div class="space-y-6">
      <div class="reveal">
        <h1 class="text-2xl md:text-3xl font-black text-white tracking-tight">${t('analytics')}</h1>
        <p class="text-slate-400 text-sm mt-1">Accuracy, weak topics, and performance over time.</p>
      </div>
      <div class="grid lg:grid-cols-4 gap-4 stagger">
        <div class="card p-5 reveal"><div class="text-[10px] text-slate-500 uppercase tracking-wider font-bold">Overall accuracy</div><div class="text-4xl font-black text-white mt-2 tabular-nums" data-count="${(()=>{const c=attempts.reduce((a,x)=>a+x.score,0),tt=attempts.reduce((a,x)=>a+x.total,0);return tt?Math.round(c/tt*100):0})()}">0</div><div class="text-xs text-slate-500 mt-1">${attempts.length} attempts</div></div>
        <div class="card p-5 reveal"><div class="text-[10px] text-slate-500 uppercase tracking-wider font-bold">Strongest topic</div><div class="text-lg font-bold text-good mt-2">${topics[0]?esc(topics[0].topic):'—'}</div><div class="text-xs text-slate-500 mt-1">${topics[0]?topics[0].pct+'% accuracy':''}</div></div>
        <div class="card p-5 reveal"><div class="text-[10px] text-slate-500 uppercase tracking-wider font-bold">Needs work</div><div class="text-lg font-bold text-bad mt-2">${weak[0]?esc(weak[0].topic):'—'}</div><div class="text-xs text-slate-500 mt-1">${weak[0]?weak[0].pct+'% accuracy':''}</div></div>
        <div class="card p-5 reveal"><div class="text-[10px] text-slate-500 uppercase tracking-wider font-bold">Batch average</div><div class="text-4xl font-black text-white mt-2 tabular-nums" data-count="72">0</div><div class="text-xs text-slate-500 mt-1">Across 62 students</div></div>
      </div>
      <div class="card p-6 reveal">
        <h3 class="text-white font-bold mb-4">Performance over time</h3>
        ${attempts.length<2?`<div class="text-slate-500 text-sm py-8 text-center">Take at least two tests to see a trend.</div>`:`
        <svg viewBox="0 0 ${W} ${H}" class="w-full h-48">
          <defs><linearGradient id="anlg" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#60a5fa"/></linearGradient>
          <linearGradient id="anag" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#7c5cff" stop-opacity=".35"/><stop offset="100%" stop-color="#7c5cff" stop-opacity="0"/></linearGradient></defs>
          ${[0,25,50,75,100].map(p=>{const y=H-pad-(p/100)*(H-pad*2);
            return`<line x1="${pad}" y1="${y}" x2="${W-pad}" y2="${y}" stroke="#1a2138"/><text x="4" y="${y+3}" fill="#5c6789" font-size="9" font-weight="600">${p}%</text>`}).join('')}
          <path d="${area}" fill="url(#anag)"/>
          <path d="${path}" fill="none" stroke="url(#anlg)" stroke-width="2.5"/>
          ${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="4.5" fill="#080b15" stroke="#7c5cff" stroke-width="2.5"/>`).join('')}
        </svg>`}
      </div>
      <div class="card p-6 reveal">
        <h3 class="text-white font-bold mb-5">Accuracy by topic</h3>
        <div class="space-y-4">
          ${topics.map(tp=>`
            <div>
              <div class="flex justify-between text-xs mb-1.5"><span class="text-slate-300">${esc(tp.topic)}</span><span class="text-slate-400 font-semibold tabular-nums">${tp.pct}% · ${tp.correct}/${tp.total}</span></div>
              <div class="h-2.5 bg-ink-700 rounded-full overflow-hidden"><div data-bar="${tp.pct}" class="h-full rounded-full ${tp.pct>=75?'bg-good':tp.pct>=50?'bg-warn':'bg-bad'} transition-all duration-1000" style="width:0"></div></div>
            </div>`).join('')}
        </div>
      </div>
      <div class="card p-6 reveal">
        <h3 class="text-white font-bold mb-4">Personalized recommendations</h3>
        <div class="grid md:grid-cols-2 gap-3 stagger">
          ${weak.map(w=>`<div class="card-flat p-4 flex items-start gap-3"><span class="text-lg shrink-0">🎯</span><div><div class="text-sm text-white font-medium">Focus: ${esc(w.topic)}</div><div class="text-xs text-slate-500 mt-0.5">Revisit the lesson and retake a targeted quiz.</div></div></div>`).join('')}
        </div>
      </div>
    </div>
  `);
}

      ${r.achievements.filter(Boolean).length?sec('Achievements',`<ul style="font-size:12px;color:#4b5563;padding-left:16px;margin:0;line-height:1.6">${r.achievements.filter(Boolean).map(a=>`<li>${esc(a)}</li>`).join('')}</ul>`):''}
    </div>
  </div>`;
  function sec(t,b){return`<div style="margin-top:24px"><div style="font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#0f172a;font-weight:700;border-bottom:1px solid #e5e7eb;padding-bottom:5px;margin-bottom:12px">${t}</div>${b}</div>`}
}

window.runAnalyzer=async()=>{
  const r=state.resume;
  if(supabaseClient&&state.user?.authenticated){
    try{
      const result=await requestAI('analyze_resume',{role:state.user.targetRole||'entry-level professional',field:state.user.fieldOfStudy||'general',resume:r});
      if(!Number.isFinite(result?.score)||!Array.isArray(result?.checks)||!Array.isArray(result?.recommendations)){
        throw new Error('The AI returned an incomplete resume analysis.');
      }
      state.analyzer={score:clamp(Math.round(result.score),0,100),
        checks:result.checks.map(c=>({label:String(c.label||'Resume evidence'),ok:!!c.ok,pts:Number(c.points)||0,tip:String(c.tip||c.evidence||'')})),
        present:Array.isArray(result.skillsPresent)?result.skillsPresent:[],
        missing:Array.isArray(result.skillsMissing)?result.skillsMissing:[],
        summary:String(result.summary||''),recommendations:result.recommendations,strengths:result.strengths||[],gaps:result.gaps||[],isAI:true};
      render(false);
      toast(`AI analysis complete — ${state.analyzer.score}/100`,'success');
      return;
    }catch(error){toast(`AI resume analysis failed: ${error.message}`,'error',6000);return}
  }
  const checks=[
    {label:'Contact information complete',ok:!!(r.email&&r.phone&&r.location),pts:10,tip:'Include email, phone, and city.'},
    {label:'LinkedIn profile present',ok:!!r.linkedin,pts:5,tip:'Recruiters verify LinkedIn.'},
    {label:'Summary is 30+ words',ok:(r.summary||'').split(/\s+/).length>=30,pts:10,tip:'Write 2–3 sentences.'},
    {label:'6+ skills listed',ok:(r.skills||[]).length>=6,pts:10,tip:'List 6–12 skills.'},
    {label:'Education section present',ok:r.education.length>0,pts:10,tip:'Add degree, institution, score.'},
    {label:'At least 2 projects',ok:r.projects.length>=2,pts:15,tip:'Show 2–3 impact-focused projects.'},
    {label:'Experience or internship',ok:r.experience.length>0,pts:15,tip:'Even a short internship counts.'},
    {label:'Achievements section',ok:r.achievements.filter(Boolean).length>0,pts:10,tip:'Add awards, ranks, certs.'},
    {label:'Quantified results',ok:/\d+%|\d+x|\d+\+/.test((r.experience.map(e=>e.desc).join(' '))+(r.projects.map(p=>p.desc).join(' '))),pts:15,tip:'Use numbers.'}
  ];
  const score=checks.reduce((a,c)=>a+(c.ok?c.pts:0),0);
  const allSkills=['JavaScript','TypeScript','React','Node.js','Python','Java','SQL','AWS','Docker','Kubernetes','Git','REST','GraphQL','MongoDB','System Design'];
  const present=allSkills.filter(s=>r.skills.map(x=>x.toLowerCase()).includes(s.toLowerCase()));
  const missing=allSkills.filter(s=>!present.includes(s)).slice(0,6);
  state.analyzer={score,checks,present,missing,isAI:false};
  render(false);
  toast(`Analyzed — score ${score}/100`,score>=75?'success':'info');
};

/* ════════════════════════════════════════════════════════════════
   INTERVIEW
   ════════════════════════════════════════════════════════════════ */
const INTERVIEW_BANK={
  hr:[
    {q:'Tell me about yourself.',hint:'Present → past → future. 60–90 seconds.'},
    {q:'Why do you want to join our company?',hint:'Reference a product, value, or practice.'},
    {q:'Where do you see yourself in five years?',hint:'Show ambition grounded in the role.'},
    {q:'What is your biggest weakness?',hint:'Real weakness + your system to improve.'},
    {q:'Tell me about a challenge you overcame.',hint:'Use STAR. Quantify the outcome.'},
    {q:'Why should we hire you?',hint:'Bridge strengths to role requirements.'},
    {q:'What do you know about our engineering culture?',hint:'Reference specific tech blogs.'},
    {q:'How do you handle feedback?',hint:'Concrete example of acting on feedback.'}
  ],
  technical:[
    {q:'Explain the difference between an array and a linked list.',hint:'Memory layout, access time, insertion cost.'},
    {q:'What happens when you type a URL in the browser?',hint:'DNS → TCP → TLS → HTTP → render.'},
    {q:'How would you detect a cycle in a linked list?',hint:'Floyd\'s cycle detection.'},
    {q:'Explain database indexing.',hint:'B-tree, write cost vs read speed.'},
    {q:'Process vs thread?',hint:'Address space, shared memory, switch cost.'},
    {q:'Time complexity of your favourite sort.',hint:'Best / avg / worst + space.'},
    {q:'Deadlock — what is it, how to prevent?',hint:'Four conditions + one strategy.'},
    {q:'REST vs GraphQL.',hint:'Over-fetching, schema, caching.'},
    {q:'What is the CAP theorem?',hint:'Consistency, Availability, Partition tolerance.'},
    {q:'How does a hashmap work internally?',hint:'Buckets, hash, collision, load factor.'}
  ],
  behavioral:[
    {q:'Describe a time you disagreed with a teammate.',hint:'Focus on the resolution.'},
    {q:'Tell me about a project you are proud of.',hint:'Problem, contribution, measurable outcome.'},
    {q:'How do you handle tight deadlines?',hint:'Prioritization framework + example.'},
    {q:'Give an example of learning something quickly.',hint:'Show the method, not just outcome.'},
    {q:'Tell me about a time you failed.',hint:'Own failure, show what changed.'},
    {q:'Describe a situation where you persuaded someone.',hint:'Context → argument → outcome.'},
    {q:'How do you prioritise multiple tasks?',hint:'Impact vs effort framework.'},
    {q:'Tell me about a time you helped a teammate.',hint:'Focus on their outcome.'}
  ]
};


const FOLLOWUPS={
  short:['Can you elaborate with a specific example?','What was your exact role?','Walk me through the steps.'],
  noNumber:['Can you quantify the impact — percentages, time saved?','What were the concrete numbers?'],
  hasStar:['Good structure. What would you do differently in hindsight?','How did your team respond?'],
  general:['What was the most challenging part?','How did you decide on that approach?','What would you do differently?']
};


window.startInterview=async type=>{
  const bank=INTERVIEW_BANK[type]||INTERVIEW_BANK.behavioral;
  let questions=bank.slice(0,5).map(b=>({q:b.q,hint:b.hint,answer:'',followUp:null}));
  let aiEnabled=false;
  if(supabaseClient&&state.user?.authenticated){
    try{
      const generated=await requestAI('interview_questions',{role:state.user.targetRole||'entry-level professional',
        field:state.user.fieldOfStudy||'general',count:5});
      if(!Array.isArray(generated?.questions)||generated.questions.length<3)throw new Error('The AI returned too few interview questions.');
      questions=generated.questions.map(q=>({q:String(q.q),hint:String(q.hint||q.skill||'Use a specific example.'),answer:'',followUp:null}));
      aiEnabled=true;
    }catch(error){toast(`AI question generation failed; using sample questions instead: ${error.message}`,'error',6000)}
  }
  state.interview={type,qIndex:0,questions,finished:false,feedback:null,aiEnabled};
  go('interview');
};
window.setInterviewAnswer=(i,v)=>{state.interview.questions[i].answer=v};
window.nextInterview=async()=>{
  const it=state.interview;
  if(!it.questions[it.qIndex].answer.trim()){toast('Please write an answer.','error');return}
  const cur=it.questions[it.qIndex];
  if(!cur.followUp){
    if(it.aiEnabled){
      try{
        const followup=await requestAI('interview_followup',{role:state.user.targetRole,field:state.user.fieldOfStudy,question:cur.q,answer:cur.answer});
        if(typeof followup?.followUp!=='string'||!followup.followUp.trim())throw new Error('The AI returned an empty follow-up question.');
        cur.followUp=followup.followUp.trim();
      }catch(error){
        toast(`AI follow-up failed; using a sample follow-up instead: ${error.message}`,'error',6000);
        cur.followUp=FOLLOWUPS.general[Math.floor(Math.random()*FOLLOWUPS.general.length)];
      }
    }else{
      const a=cur.answer.toLowerCase().trim();
      const wc=a.split(/\s+/).filter(Boolean).length;
      const hasNum=/\d/.test(a);
      const hasStar=/\b(first|then|next|finally|because|so|result|learned|impact|led to)\b/.test(a);
      let pool=FOLLOWUPS.general;
      if(wc<25)pool=FOLLOWUPS.short;
      else if(!hasNum)pool=FOLLOWUPS.noNumber;
      else if(hasStar)pool=FOLLOWUPS.hasStar;
      cur.followUp=pool[Math.floor(Math.random()*pool.length)];
    }
    render(false);
    return;
  }
  if(it.qIndex<it.questions.length-1){it.qIndex++;render(false);return}
  await finishInterview();
};
window.finishInterviewEarly=()=>{
  const it=state.interview;
  const answered=it.questions.filter(q=>q.answer.trim()).length;
  if(!answered){toast('Answer at least one question.','error');return}
  confirmDialog('Finish interview early?',()=>finishInterview(),{yesLabel:'Finish'});
};
async function finishInterview(){
  const it=state.interview;
  let feedback;
  if(it.aiEnabled){
    try{
      const result=await requestAI('interview_feedback',{role:state.user.targetRole,field:state.user.fieldOfStudy,
        answers:it.questions.map(q=>({question:q.q,answer:q.answer}))});
      if(!Number.isFinite(result?.score)||!Array.isArray(result?.answers))throw new Error('The AI returned an incomplete interview report.');
      const per=it.questions.map((q,i)=>{
        const answer=result.answers[i]||{};
        const overall=clamp(Math.round(Number(answer.score)||0),0,100);
        return{i,words:q.answer.trim().split(/\s+/).filter(Boolean).length,overall,
          feedback:String(answer.feedback||''),improvement:String(answer.improvement||'')};
      });
      const avg=key=>Math.round(per.reduce((sum,item)=>sum+(Number(item[key])||0),0)/Math.max(1,per.length));
      feedback={per,communication:avg('overall'),relevance:avg('overall'),structure:avg('overall'),
        technical:it.type==='technical'?avg('overall'):null,overall:clamp(Math.round(result.score),0,100),isAI:true,
        recommendations:Array.isArray(result.nextSteps)?result.nextSteps:[]};
    }catch(error){toast(`AI interview evaluation failed: ${error.message}`,'error',6000);return}
  }else feedback=scoreInterview(it);
  it.finished=true;
  it.feedback=feedback;
  state.interviews.push({type:it.type,at:new Date().toISOString(),overall:it.feedback.overall,isAI:it.feedback.isAI});
  state.interviewsDone=state.interviews.length+4;
  if(state.interviewsDone>=5&&!state.badges.includes('b5'))state.badges.push('b5');
  state.activity.unshift({type:'interview',icon:'🎤',color:'from-rose-500 to-pink-600',text:`Completed a <b>${it.type}</b> mock interview`,at:new Date().toISOString(),id:uid()});
  render(false);
  confetti(40);
  toast('Interview completed!','success');
}
window.exitInterview=()=>{state.interview=null;go('interview')};


function scoreInterview(it){
  const per=it.questions.map((q,i)=>{
    const words=q.answer.trim().split(/\s+/).filter(Boolean).length;
    const sents=q.answer.split(/[.!?]+/).filter(s=>s.trim().length>3).length;
    const hasStructure=/\b(first|second|then|finally|because|so|therefore|for example|for instance|in my)\b/i.test(q.answer);
    const hasNumber=/\d/.test(q.answer);
    const relevance=Math.min(100,Math.round(words*1.7));
    const structure=Math.min(100,Math.round(sents*18+(hasStructure?20:0)));
    const communication=Math.min(100,Math.round(words*1.5+(sents>1?15:0)));
    const technical=it.type==='technical'?Math.min(100,Math.round(relevance*.6+(hasNumber?35:0))):null;
    const overall=technical!==null?Math.round((relevance+structure+communication+technical)/4):Math.round((relevance+structure+communication)/3);
    return{i,words,relevance,structure,communication,technical,overall};
  });
  const avg=k=>Math.round(per.reduce((a,p)=>a+p[k],0)/per.length);
  return{per,communication:avg('communication'),relevance:avg('relevance'),structure:avg('structure'),technical:it.type==='technical'?avg('technical'):null,overall:Math.round(per.reduce((a,p)=>a+p.overall,0)/per.length),isAI:false};
}

        <div class="mt-6">
          <label class="text-[10px] text-slate-500 uppercase tracking-wider font-bold">Your answer</label>
          <textarea id="answerBox" rows="8" oninput="setInterviewAnswer(${it.qIndex},this.value)" placeholder="Type your answer. Aim for 80–140 words." class="w-full mt-2 bg-ink-800 border border-ink-650 rounded-xl px-4 py-3 text-sm text-slate-200 resize-none leading-relaxed">${esc(q.answer)}</textarea>
          <div class="text-right text-[11px] text-slate-500 mt-1.5">${q.answer.trim()?q.answer.trim().split(/\s+/).length:0} words</div>
        </div>
      </div>
      <div class="flex items-center justify-between gap-3 flex-wrap">
        <button onclick="exitInterview()" class="btn-ghost card-flat px-4 py-2.5 rounded-lg text-sm text-slate-400 hover:text-bad">Exit</button>
        <div class="flex gap-1.5 flex-wrap justify-center">

        </div>
        <button onclick="nextInterview()" class="btn-primary text-white px-5 py-2.5 rounded-lg text-sm font-semibold">
          ${showFollowUp?'Continue →':it.qIndex===it.questions.length-1?'Finish':'Next →'}
        </button>
      </div>
    </div>
  `);
}

window.setCode=v=>{state.code.src=v};
window.setStdin=v=>{state.code.stdin=v};
window.setLang=v=>{state.code.lang=v;const p=CODING_PROBLEMS.find(x=>x.id===state.code.problemId);if(p&&p.starter[v])state.code.src=p.starter[v];render(false)};
window.setProblem=id=>{const p=CODING_PROBLEMS.find(x=>x.id===id);if(!p)return;state.code.problemId=id;state.code.src=p.starter[state.code.lang]||p.starter.python;state.code.output='';render(false)};
window.loadProblemExample=i=>{const p=CODING_PROBLEMS.find(x=>x.id===state.code.problemId);if(p&&p.tests[i])state.code.stdin=p.tests[i].input+'\n';render(false)};


const PISTON_LANG={python:{language:'python',version:'3.10.0'},javascript:{language:'javascript',version:'18.15.0'},java:{language:'java',version:'15.0.2'},cpp:{language:'c++',version:'10.2.0'}};


window.runCode=async()=>{
  state.code.running=true;state.code.output='';
  render(false);
  const code=state.code.src;
  const lang=state.code.lang;
  const stdin=state.code.stdin;


  try{
    const resp=await fetch('https://emkc.org/api/v2/piston/execute',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        language:PISTON_LANG[lang].language,
        version:PISTON_LANG[lang].version,
        files:[{name:lang==='cpp'?'main.cpp':lang==='java'?'Main.java':lang==='python'?'main.py':'main.js',content:code}],
        stdin:stdin
      })
    });
    const data=await resp.json();
    if(data.run){
      const out=(data.run.stdout||'')+(data.run.stderr?`\n[stderr]\n${data.run.stderr}`:'');
      state.code.output=out||'(no output)';
      if(data.run.code!==0)state.code.output+=`\n\n[exit code ${data.run.code}]`;
    }else if(data.message){
      state.code.output=`[Execution error]\n${data.message}`;
    }else{
      state.code.output='[Unexpected response]';
    }
  }catch(e){
    state.code.output=`[Network error — real execution requires internet to reach the Piston sandbox]\n\n${e.message}\n\nThe code editor remains functional as a workspace. Execution is provided by the free public Piston API (no key required).`;
  }
  state.code.running=false;
  render(false);
};
window.reviewCode=async()=>{
  const problem=CODING_PROBLEMS.find(item=>item.id===state.code.problemId);
  try{
    state.code.review=await requestAI('code_review',{role:state.user?.targetRole||'software developer',
      field:state.user?.fieldOfStudy||'Technology',language:state.code.lang,task:problem?.statement||problem?.title||'Code review',code:state.code.src});
    if(!state.code.review||!Array.isArray(state.code.review.issues)||!Array.isArray(state.code.review.suggestions)){
      throw new Error('The AI returned an incomplete code review.');
    }
    render(false);
  }catch(error){toast(`AI code review failed: ${error.message}`,'error',6000)}
};
window.copyCode=()=>{navigator.clipboard.writeText(state.code.src);toast('Code copied','success',1600)};
window.downloadCode=()=>{
  const ext={python:'py',javascript:'js',java:'java',cpp:'cpp'}[state.code.lang];
  const blob=new Blob([state.code.src],{type:'text/plain'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`solution.${ext}`;a.click();
};
window.syncGutter=()=>{
  const ta=$('#codeArea');if(!ta)return;
  const lines=ta.value.split('\n').length;
  const g=$('.gutter');if(!g)return;
  const cur=g.children.length;
  if(lines>cur){for(let i=cur;i<lines;i++){const d=document.createElement('div');d.className='ln';d.textContent=i+1;g.appendChild(d)}}
  else if(lines<cur){for(let i=cur;i>lines;i--)g.removeChild(g.lastChild)}
};
window.loadSubmission=id=>{const s=state.codeSubs.find(x=>x.id===id);if(!s)return;state.code.lang=s.lang;state.code.src=s.code;render(false);toast('Submission loaded','success',1800)};

window.checkCompanyFit=async id=>{
  const company=COMPANIES.find(c=>c.id===id);
  if(!company){toast('Company not found.','error');return}
  try{
    const result=await requestAI('company_fit',{role:state.user?.targetRole||company.roles[0],field:state.user?.fieldOfStudy||'general',company:{name:company.name,roles:company.roles,topics:company.topics},resume:state.resume});
    if(!Number.isFinite(result?.score)||!Array.isArray(result?.gaps)||!Array.isArray(result?.recommendations)){
      throw new Error('The AI returned an incomplete company-fit report.');
    }
    modal({title:`${company.name} · Role fit`,size:'lg',body:`
      <div class="space-y-5">
        <div class="text-center"><div class="text-5xl font-black text-brand-300">${clamp(Math.round(result.score),0,100)}%</div><p class="text-xs text-slate-400 mt-1">Evidence-based preparation estimate — not a hiring probability.</p></div>
        <p class="text-sm text-slate-300 leading-relaxed">${esc(result.summary||'')}</p>
        <div><h4 class="text-white font-semibold mb-2">Resume gaps</h4><ul class="list-disc list-inside space-y-1 text-sm text-slate-400">${result.gaps.map(g=>`<li>${esc(g)}</li>`).join('')||'<li>No specific gaps identified.</li>'}</ul></div>
        <div><h4 class="text-white font-semibold mb-2">Recommended improvements</h4><ul class="list-disc list-inside space-y-1 text-sm text-slate-300">${result.recommendations.map(g=>`<li>${esc(g)}</li>`).join('')}</ul></div>
        <div><h4 class="text-white font-semibold mb-2">Practice topics</h4><div class="flex flex-wrap gap-2">${(result.preparationTopics||[]).map(topic=>`<span class="chip px-3 py-1 rounded-full bg-brand-500/15 text-brand-300 text-xs">${esc(topic)}</span>`).join('')}</div></div>
      </div>`,actions:[{label:'Close',class:'btn-ghost card-flat px-5 py-2.5 rounded-xl text-sm text-slate-300'}]});
  }catch(error){toast(`Company-fit analysis failed: ${error.message}`,'error',6000)}
};
