window.toggleJobSave=id=>{const j=state.jobs.find(x=>x.id===id);if(j){j.saved=!j.saved;render(false);toast(j.saved?'Job saved':'Removed','success',1600)}};
window.toggleJobApply=id=>{
  const j=state.jobs.find(x=>x.id===id);
  if(j){
    if(j.applied){j.applied=false;render(false);return}
    confirmDialog(`Apply to ${j.title} at ${j.company}?`,()=>{
      j.applied=true;
      state.activity.unshift({type:'jobs',icon:'💼',color:'from-brand-500 to-sky-500',text:`Applied to <b>${esc(j.title)}</b> at ${esc(j.company)}`,at:new Date().toISOString(),id:uid()});
      confetti(30);render(false);toast('Application submitted!','success');
    },{yesLabel:'Apply'});
  }
};


/* ════════════════════════════════════════════════════════════════
   FORMULA CARDS
   ════════════════════════════════════════════════════════════════ */
function viewFormulas(){
  const role=state.user?.targetRole||'';
  const categories=/product manager/i.test(role)?['Quantitative','Logical','Verbal','Product']:
    /account|finance|credit|tax|audit/i.test(role)?['Quantitative','Logical','Verbal','Finance']:
    /marketing|brand|copywriter/i.test(role)?['Quantitative','Verbal','Marketing']:
    /ux|design/i.test(role)?['Logical','Verbal','Marketing']:
    /software|engineer|developer|programmer/i.test(role)||!role?['Quantitative','Logical','Verbal','Technical']:
    ['Quantitative','Logical','Verbal'];
  const formulas=FORMULAS.filter(formula=>categories.includes(formula.cat));
  const cats=['All',...new Set(formulas.map(f=>f.cat))];
  const filter=state.formulaCat||'All';
  const list=filter==='All'?formulas:formulas.filter(f=>f.cat===filter);
  const known=state.formulaKnown||{};
  const knownCount=formulas.filter(formula=>known[formula.title]).length;
  return layout(`
    <div class="space-y-6">
      <div class="flex flex-wrap items-end justify-between gap-4 reveal">
        <div>
          <h1 class="text-2xl md:text-3xl font-black text-white tracking-tight">${t('formulas')}</h1>
          <p class="text-slate-400 text-sm mt-1">Role-relevant formula and metric cards for ${esc(role||'placement preparation')}.</p>
        </div>
        <div class="card px-5 py-3 flex items-center gap-4">
          <div class="text-right">
            <div class="text-2xl font-black text-white tabular-nums"><span data-count="${knownCount}">0</span><span class="text-sm text-slate-500">/${formulas.length}</span></div>
            <div class="text-[10px] text-slate-500 uppercase tracking-wider font-bold">Known</div>
          </div>
          <div class="w-24 h-2 bg-ink-700 rounded-full overflow-hidden"><div data-bar="${formulas.length?Math.round(knownCount/formulas.length*100):0}" class="h-full bg-gradient-to-r from-brand-500 to-sky-500" style="width:0"></div></div>
        </div>
      </div>
      <div class="flex gap-2 flex-wrap reveal">
        ${cats.map(c=>`<button onclick="state.formulaCat='${c}';render(false)" class="chip px-4 py-2 rounded-xl border text-xs font-semibold ${filter===c?'border-brand-500 bg-brand-500/10 text-white':'border-ink-650 text-slate-400 hover:text-white'}">${c}</button>`).join('')}
      </div>
      <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-5 stagger">
        ${list.map(f=>{
          const isKnown=known[f.title];
          return`<div class="flip-card reveal ${isKnown?'ring-1 ring-good/40':''}" onclick="this.classList.toggle('flipped')">
            <div class="flip-inner">
              <div class="flip-face card">
                <div class="text-[10px] text-brand-300 uppercase tracking-wider font-bold">${esc(f.cat)} · ${esc(f.topic)}</div>
                <div class="text-white font-bold text-lg mt-3">${esc(f.title)}</div>
                <div class="text-slate-400 text-sm mt-3">${esc(f.front)}</div>
                <div class="text-[10px] text-slate-600 mt-4">Tap to reveal →</div>
              </div>
              <div class="flip-face flip-back card" style="background:linear-gradient(180deg,rgba(124,92,255,.15),rgba(14,19,36,.95))">
                <div class="text-[10px] text-brand-300 uppercase tracking-wider font-bold mb-2">Formula</div>
                <div class="text-slate-200 text-sm leading-relaxed whitespace-pre-line text-left">${esc(f.back)}</div>
                <button onclick="event.stopPropagation();toggleFormulaKnown('${esc(f.title).replace(/'/g,"\\'")}')" class="mt-3 text-[11px] px-3 py-1.5 rounded-full border ${isKnown?'bg-good/15 text-good border-good/30':'border-ink-650 text-slate-400 hover:border-brand-500/50'} font-semibold">${isKnown?'✓ Marked known':'Mark as known'}</button>
              </div>
            </div>
          </div>`}).join('')}
      </div>
    </div>
  `);
}
window.toggleFormulaKnown=title=>{state.formulaKnown=state.formulaKnown||{};state.formulaKnown[title]=!state.formulaKnown[title];render(false);toast(state.formulaKnown[title]?'Marked known ✓':'Unmarked','success',1400)};

window.startRoleSpecificGD=async()=>{

    if(!Array.isArray(result?.topics)||!result.topics.length)throw new Error('The AI returned no discussion topics.');

    if(typeof topic.title!=='string'||typeof topic.ctx!=='string')throw new Error('The generated topic was incomplete.');

window.startGD=topicArg=>{
  const topic=typeof topicArg==='number'?GD_TOPICS[topicArg]:topicArg;
  if(!topic){toast('Discussion topic not found.','error');return}
  state.gd={topic,messages:[{role:'system',text:'Discussion started. Enter early with a data point or clear position.'}],elapsed:0,startedAt:Date.now(),active:true};
  go('gd');
  startGDTimer();
  setTimeout(()=>aiGDReply('opener'),1600);
};
let _gdTimer=null;
function startGDTimer(){
  clearInterval(_gdTimer);
  _gdTimer=setInterval(()=>{
    if(!state.gd||!state.gd.active){clearInterval(_gdTimer);return}
    state.gd.elapsed++;
    const el=document.getElementById('gdTimer');
    if(el)el.textContent=fmtT(state.gd.elapsed);
  },1000);
}
window.sendGDMessage=()=>{
  const inp=document.getElementById('gdInput');if(!inp)return;
  const txt=inp.value.trim();if(!txt)return;
  inp.value='';
  state.gd.messages.push({role:'you',text:txt});
  render(false);scrollGD();
  setTimeout(()=>aiGDReply(classifyGDMessage(txt)),900+Math.random()*700);
};
function classifyGDMessage(t){
  const s=t.toLowerCase();
  if(/\?/.test(t))return 'question';
  if(/\d+%|percent|million|billion|study|research|data/.test(s))return 'data';
  if(/agree|exactly|right|true|correct/.test(s))return 'agree';
  if(/disagree|but|however|wrong/.test(s))return 'disagree';
  if(/summar|conclude|overall|finally/.test(s))return 'summarize';
  return 'redirect';
}
async function aiGDReply(kind){
  if(!state.gd||!state.gd.active)return;
  if(supabaseClient&&state.user?.authenticated){
    try{
      const result=await requestAI('gd_reply',{role:state.user.targetRole||'student',field:state.user.fieldOfStudy||'general',
        topic:state.gd.topic,messages:state.gd.messages.slice(-8)});
      if(!Array.isArray(result?.replies)||result.replies.length<2||result.replies.some(reply=>
        !Number.isInteger(reply.speakerIndex)||reply.speakerIndex<0||reply.speakerIndex>=GD_PARTICIPANTS.length||
        typeof reply.message!=='string'||!reply.message.trim()))throw new Error('The AI returned invalid discussion responses.');
      result.replies.slice(0,2).forEach(reply=>state.gd.messages.push({
        name:GD_PARTICIPANTS[reply.speakerIndex].name,text:reply.message.trim()
      }));
      render(false);scrollGD();
      return;
    }catch(error){toast(`AI discussion reply failed; using a sample response: ${error.message}`,'error',6000)}
  }
  const participant=GD_PARTICIPANTS[Math.floor(Math.random()*GD_PARTICIPANTS.length)];
  const replies=GD_REPLIES[kind]||GD_REPLIES.redirect;
  const reply=replies[Math.floor(Math.random()*replies.length)];
  state.gd.messages.push({name:participant.name,text:reply});
  render(false);scrollGD();
  if(Math.random()>0.5){
    setTimeout(()=>{
      if(!state.gd||!state.gd.active)return;
      const p2=GD_PARTICIPANTS.filter(p=>p.name!==participant.name)[Math.floor(Math.random()*2)];
      const r2=GD_REPLIES[['agree','data','redirect'][Math.floor(Math.random()*3)]];
      state.gd.messages.push({name:p2.name,text:r2[Math.floor(Math.random()*r2.length)]});
      render(false);scrollGD();
    },1400);
  }
}
function scrollGD(){setTimeout(()=>{const el=document.getElementById('gdMessages');if(el)el.scrollTop=el.scrollHeight},60)}
window.exitGD=()=>{state.gd=null;clearInterval(_gdTimer);go('gd')};
window.endGD=()=>{
  if(!state.gd)return;
  state.gd.active=false;clearInterval(_gdTimer);
  const myMsgs=state.gd.messages.filter(m=>m.role==='you').length;

        <div class="card-flat p-3 text-center"><div class="text-[10px] text-slate-500 uppercase font-bold">Participants</div><div class="text-lg font-black text-white mt-1">4</div></div>
      </div>
      <div class="card-flat p-4 text-xs text-slate-400 leading-relaxed">

      <div class="flex flex-wrap gap-2">${a.fillers.map(f=>`<span class="text-xs px-2.5 py-1 rounded-full bg-warn/10 text-warn border border-warn/30 font-medium">"${esc(f.word)}" × ${f.count}</span>`).join('')}</div></div>`:''}

}
window.nextPrompt=()=>{const idx=FLUENCY_PROMPTS.indexOf(state.fluency.prompt);state.fluency.prompt=FLUENCY_PROMPTS[(idx+1)%FLUENCY_PROMPTS.length];state.fluency.analysis=null;render(false)};
let _recognition=null;
window.toggleListening=()=>{
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){toast('Speech recognition not supported. Please type.','warn');return}
  if(state.fluency.listening){_recognition?.stop();state.fluency.listening=false;render(false);return}
  _recognition=new SR();
  _recognition.continuous=true;
  _recognition.interimResults=true;
  _recognition.lang=state.lang==='hi'?'hi-IN':'en-IN';
  _recognition.onresult=e=>{
    let transcript='';
    for(let i=e.resultIndex;i<e.results.length;i++)transcript+=e.results[i][0].transcript;
    state.fluency.text=(state.fluency.text+' '+transcript).trim();
    const box=document.getElementById('fluencyBox');
    if(box)box.value=state.fluency.text;
  };
  _recognition.onerror=()=>{state.fluency.listening=false;render(false)};
  _recognition.onend=()=>{state.fluency.listening=false;render(false)};
  _recognition.start();
  state.fluency.listening=true;
  render(false);
  toast('Listening — speak clearly','success',1600);
};
window.analyzeFluency=()=>{
  const text=state.fluency.text.trim();
  if(text.split(/\s+/).length<15){toast('Please write at least 15 words.','error');return}
  const words=text.split(/\s+/).filter(Boolean);
  const sentences=text.split(/[.!?]+/).filter(s=>s.trim().length>3);
  const avgLen=words.length/Math.max(1,sentences.length);
  const uniq=new Set(words.map(w=>w.toLowerCase().replace(/[^a-z]/g,'')));
  const uniqRatio=uniq.size/words.length;
  const fillers=['um','uh','like','you know','basically','actually','so','well'].map(w=>({word:w,count:(text.toLowerCase().match(new RegExp('\\b'+w.replace(' ','\\\\s')+'\\b','g'))||[]).length})).filter(x=>x.count>0);
  const structure=/\b(first|second|then|next|finally|because|however|therefore|for example)\b/i.test(text)?78:55;
  const clarity=clamp(Math.round(100-Math.abs(avgLen-15)*4),30,98);
  const vocab=clamp(Math.round(uniqRatio*130),40,98);
  const confidence=clamp(Math.round((100-fillers.reduce((a,x)=>a+x.count,0)*4)*0.8+20),40,98);
  const strengths=[];const improvements=[];
  if(avgLen>=10&&avgLen<=20)strengths.push('Sentence length is easy to follow.');else improvements.push(avgLen>20?'Break up long sentences.':'Add more detail.');
  if(uniqRatio>0.6)strengths.push('Strong vocabulary variety.');else improvements.push('Vary your word choice.');
  if(structure>=70)strengths.push('Clear structure with transitions.');else improvements.push('Use connectors: "First… then… finally…".');
  if(fillers.length===0)strengths.push('No filler words — clean delivery.');else improvements.push(`Reduce fillers: ${fillers.map(f=>f.word).join(', ')}.`);
  state.fluency.analysis={clarity,vocab,structure,confidence,fillers,strengths,improvements};
  render(false);
  toast('Analysis ready','success');
};

function generateStudyPlan(){

  weak.forEach((w,i)=>{
    tasks.push({day:days[i%7],type:'practice',title:`Practice ${w.topic}`,detail:`Current accuracy ${w.pct}%. Target 75%.`,done:state.studyPlanDone?.[`${i}-practice`]||false,key:`${i}-practice`});
    tasks.push({day:days[(i+3)%7],type:'revise',title:`Revise ${w.topic} cards`,detail:`Flip 5 formula cards.`,done:state.studyPlanDone?.[`${i}-revise`]||false,key:`${i}-revise`});
  });
  tasks.push({day:'Sat',type:'code',title:'Solve 2 medium DSA problems',detail:'Arrays or sliding window.',done:state.studyPlanDone?.['code']||false,key:'code'});
  tasks.push({day:'Sun',type:'interview',title:'Mock interview — technical',detail:'20-minute session, read the report.',done:state.studyPlanDone?.['interview']||false,key:'interview'});
  tasks.push({day:'Sun',type:'review',title:'Weekly review + resume',detail:'Check analytics, update one bullet.',done:state.studyPlanDone?.['review']||false,key:'review'});
  return tasks;
}

window.generateCert=lessonId=>{
  const l=LESSONS.find(x=>x.id===lessonId);
  const u=state.user;
  const c=document.createElement('canvas');
  c.width=1200;c.height=850;
  const ctx=c.getContext('2d');
  const g=ctx.createLinearGradient(0,0,1200,850);
  g.addColorStop(0,'#0a0e1c');g.addColorStop(1,'#131a2e');
  ctx.fillStyle=g;ctx.fillRect(0,0,1200,850);
  ctx.strokeStyle='rgba(124,92,255,.35)';ctx.lineWidth=2;ctx.strokeRect(40,40,1120,770);
  ctx.strokeStyle='rgba(96,165,250,.15)';ctx.lineWidth=1;ctx.strokeRect(55,55,1090,740);
  ctx.fillStyle='rgba(124,92,255,.4)';
  [[40,40],[1140,40],[40,790],[1140,790]].forEach(([x,y])=>{ctx.beginPath();ctx.arc(x,y,8,0,Math.PI*2);ctx.fill()});
  ctx.textAlign='center';
  ctx.fillStyle='#7c5cff';ctx.font='bold 18px Inter, sans-serif';
  ctx.fillText('SKILLPATH · CERTIFICATE OF COMPLETION',600,130);
  ctx.fillStyle='#a78bfa';ctx.font='bold 12px Inter, sans-serif';
  ctx.fillText('FROM RESUME TO OFFER LETTER',600,155);
  ctx.strokeStyle='rgba(124,92,255,.4)';ctx.beginPath();ctx.moveTo(400,180);ctx.lineTo(800,180);ctx.stroke();
  ctx.fillStyle='#e0d9ff';ctx.font='500 22px Inter, sans-serif';
  ctx.fillText('This is to certify that',600,290);
  ctx.fillStyle='#ffffff';ctx.font='bold 64px Inter, sans-serif';
  ctx.fillText(u.name,600,380);
  ctx.strokeStyle='rgba(124,92,255,.6)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(300,405);ctx.lineTo(900,405);ctx.stroke();
  ctx.fillStyle='#94a3b8';ctx.font='400 20px Inter, sans-serif';
  ctx.fillText('has successfully completed',600,460);
  ctx.fillStyle='#c4b5fd';ctx.font='bold 34px Inter, sans-serif';
  ctx.fillText(l.title,600,515);
  ctx.fillStyle='#5e6f7e';ctx.font='400 15px Inter, sans-serif';
  ctx.fillText(`${l.modules.length} modules · ${l.cat} · Placement Preparation Track`,600,555);
  ctx.strokeStyle='rgba(124,92,255,.2)';ctx.beginPath();ctx.moveTo(300,590);ctx.lineTo(900,590);ctx.stroke();
  ctx.textAlign='left';ctx.fillStyle='#5c6789';ctx.font='400 13px Inter, sans-serif';
  const issueDate=new Date().toLocaleDateString('en-IN',{day:'numeric',month:'long',year:'numeric'});
  const certId='SP-'+Math.random().toString(36).slice(2,8).toUpperCase()+'-'+Date.now().toString(36).slice(-4).toUpperCase();
  ctx.fillText(`Issued: ${issueDate}`,120,730);
  ctx.fillText(`Certificate ID: ${certId}`,120,755);
  ctx.fillText(`Batch: ${u.batch}`,120,780);
  ctx.textAlign='right';ctx.fillText('Authorised Signatory',1080,770);
  ctx.strokeStyle='rgba(124,92,255,.5)';ctx.beginPath();ctx.moveTo(880,745);ctx.lineTo(1080,745);ctx.stroke();
  c.toBlob(b=>{
    const url=URL.createObjectURL(b);
    const a=document.createElement('a');
    a.href=url;a.download=`SkillPath_${l.title.replace(/\s+/g,'_')}_${u.name.replace(/\s+/g,'_')}.png`;a.click();
    URL.revokeObjectURL(url);
    confetti(50);
    toast('Certificate downloaded 🎖','success',3000);
    state.activity.unshift({type:'badge',icon:'🎖',color:'from-amber-500 to-orange-600',text:`Earned a certificate for <b>${esc(l.title)}</b>`,at:new Date().toISOString(),id:uid()});
  },'image/png');
  const preview=c.toDataURL();
  modal({title:'Your Certificate',size:'lg',body:`<img src="${preview}" class="w-full rounded-xl border border-ink-650" alt="Certificate"/>`,actions:[{label:'Close',class:'btn-ghost card-flat px-5 py-2.5 rounded-xl text-sm text-slate-300'}]});
};

window.refreshCommunityData=()=>{state.communityLoaded=false;state.communityLoading=false;render(false)};
async function loadCommunityData(){
  if(!supabaseClient||!state.user?.authenticated)return;
  try{
    const[{data:peers,error:peersError},{data:requests,error:requestsError},{data:forum,error:forumError}]=await Promise.all([
      supabaseClient.from('profiles').select('id,display_name,field_of_study,target_role').neq('id',state.user.id).limit(100),
      supabaseClient.from('chat_requests').select('*').or(`requester_id.eq.${state.user.id},recipient_id.eq.${state.user.id}`).order('created_at',{ascending:false}),
      supabaseClient.from('forum_threads').select('*').order('created_at',{ascending:false}).limit(100)
    ]);
    if(peersError)throw peersError;
    if(requestsError)throw requestsError;
    if(forumError)throw forumError;
    state.communityPeers=peers||[];
    state.chatRequests=requests||[];
    state.communityThreads=(forum||[]).map(thread=>{
      const author=state.communityPeers.find(peer=>peer.id===thread.author_id)?.display_name||'Student';
      return{...thread,author,avatar:ini(author)};
    });
    state.communityLoaded=true;
    state.communityLoading=false;
    if(state.view==='community')render(false);
  }catch(error){
    state.communityLoaded=true;
    state.communityLoading=false;
    toast(`Could not load community data: ${error.message}`,'error',6000);
    if(state.view==='community')render(false);
  }
}
window.requestMentor=async id=>{
  if(!state.user?.authenticated){toast('Sign in with a Supabase student account to send a real 1:1 request.','info',4000);return}
  if(id===state.user.id){toast('You cannot request a chat with yourself.','error');return}
  const{error}=await supabaseClient.from('chat_requests').upsert({
    requester_id:state.user.id,recipient_id:id,job_role:state.user.targetRole||'Student'
  },{onConflict:'requester_id,recipient_id'});
  if(error){toast(`Could not send chat request: ${error.message}`,'error',6000);return}
  toast('1:1 request sent. The student can accept it from their Requests tab.','success',4500);
  refreshCommunityData();
};
window.respondToChat=async(id,status)=>{
  const{error}=await supabaseClient.from('chat_requests').update({status}).eq('id',id).eq('recipient_id',state.user.id);
  if(error){toast(`Could not update the chat request: ${error.message}`,'error',6000);return}
  toast(status==='accepted'?'Chat request accepted.':'Chat request declined.','success');
  refreshCommunityData();
};
let activeChatChannel=null;
function appendChatMessage(message){
  const list=$('#chatMessageList');
  if(!list||list.querySelector(`[data-message-id="${message.id}"]`))return;
  const row=document.createElement('div');
  row.dataset.messageId=message.id;
  row.className=`max-w-[85%] rounded-xl px-3 py-2 text-sm ${message.sender_id===state.user.id?'ml-auto bg-brand-500/20 text-white':'bg-ink-700 text-slate-200'}`;
  const sender=state.communityPeers.find(peer=>peer.id===message.sender_id)?.display_name||state.user.name;
  row.textContent=`${sender}: ${message.body}`;
  list.appendChild(row);
  list.scrollTop=list.scrollHeight;
}
window.openChat=async requestId=>{
  const request=state.chatRequests.find(item=>item.id===requestId&&item.status==='accepted');
  if(!request){toast('This chat is not available. Accept the request first.','error');return}
  const{data:messages,error}=await supabaseClient.from('chat_messages').select('*').eq('request_id',requestId).order('created_at',{ascending:true}).limit(200);
  if(error){toast(`Could not open chat: ${error.message}`,'error',6000);return}
  const peerId=request.requester_id===state.user.id?request.recipient_id:request.requester_id;
  modal({title:`Chat · ${state.user.targetRole||'Career preparation'}`,size:'lg',body:`
    <div class="text-xs text-slate-400 mb-3">Chat with ${esc(state.communityPeers.find(peer=>peer.id===peerId)?.display_name||'Student')} about ${esc(request.job_role||'their career goal')}.</div>
    <div id="chatMessageList" class="h-72 overflow-y-auto space-y-2 card-flat p-3"></div>
    <form id="chatMessageForm" data-request-id="${requestId}" onsubmit="sendChatMessage(event)" class="flex gap-2 mt-3">
      <input id="chatMessageInput" maxlength="4000" required class="flex-1 bg-ink-800 border border-ink-650 rounded-lg px-3 py-2 text-sm text-white" placeholder="Write a message…"/>
      <button class="btn-primary px-4 py-2 rounded-lg text-sm text-white font-semibold">Send</button>
    </form>`,actions:[{label:'Close',class:'btn-ghost card-flat px-5 py-2.5 rounded-xl text-sm text-slate-300'}]});
  messages.forEach(appendChatMessage);
  if(activeChatChannel)await supabaseClient.removeChannel(activeChatChannel);
  const modalRoot=$('#modalRoot').lastElementChild;
  const observer=new MutationObserver(()=>{
    if(!modalRoot.isConnected){
      observer.disconnect();
      if(activeChatChannel)supabaseClient.removeChannel(activeChatChannel);
      activeChatChannel=null;
    }
  });
  observer.observe($('#modalRoot'),{childList:true});
  activeChatChannel=supabaseClient.channel(`chat-messages-${requestId}`)
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'chat_messages',filter:`request_id=eq.${requestId}`},payload=>appendChatMessage(payload.new))
    .subscribe(status=>{if(status==='CHANNEL_ERROR')toast('Live chat connection failed. Refresh to reconnect.','error',5000)});
};
window.sendChatMessage=async event=>{
  event.preventDefault();
  const form=event.currentTarget;
  const input=$('#chatMessageInput');
  const body=input.value.trim();
  if(!body)return;
  const{data,error}=await supabaseClient.from('chat_messages').insert({
    request_id:form.dataset.requestId,sender_id:state.user.id,body
  }).select().single();
  if(error){toast(`Could not send message: ${error.message}`,'error',6000);return}
  input.value='';
  appendChatMessage(data);
};
window.likeThread=id=>{const th=FORUM_THREADS.find(x=>x.id===id);if(th){th.likes++;render(false)}};
window.postThread=async()=>{
  const el=document.getElementById('newThreadTitle');
  const val=el?.value.trim();if(!val)return;
  if(state.user?.authenticated){
    const{error}=await supabaseClient.from('forum_threads').insert({
      author_id:state.user.id,title:val,body:val,job_role:state.user.targetRole||''
    });
    if(error){toast(`Could not post to the forum: ${error.message}`,'error',6000);return}
    el.value='';
    await loadCommunityData();
    toast('Discussion posted to the shared forum.','success');
    return;
  }
  FORUM_THREADS.unshift({id:'t'+uid(),title:val,author:state.user.name,avatar:state.user.avatar,replies:0,likes:0,tag:'Question',time:'just now',body:'Posted from the forum composer.',mine:true});
  el.value='';render(false);toast('Thread posted','success');
};

    </div>
    <div class="card-flat p-4 text-xs text-slate-500 flex items-start gap-3 reveal"><span>⚠️</span><span>Heuristic feedback based on URL structure and your resume. Not a professional audit.</span></div>
  </div>`;
}
window.analyzePortfolio=()=>{
  const p=state.portfolio;
  if(!p.linkedin&&!p.github){toast('Please enter at least one URL','error');return}
  const hasLi=/linkedin\.com\/in\/[\w-]+/.test(p.linkedin);
  const hasGh=/github\.com\/[\w-]+/.test(p.github);
  const li=hasLi?72+Math.round(Math.random()*18):32;
  const gh=hasGh?65+Math.round(Math.random()*22):30;
  const consistency=Math.round((li+gh)/2);
  const overall=Math.round((li+gh+consistency)/3);
  const liFixes=[hasLi?'✓ URL format looks valid.':'Fix URL: use linkedin.com/in/your-handle.','Add a headline: "Aspiring SDE | 150+ DSA problems".','Feature 2–3 projects.','Get 2–3 recommendations.','Post weekly.'];
  const ghFixes=[hasGh?'✓ URL format looks valid.':'Fix URL: use github.com/your-username.','Pin 4–6 repositories.','Add a profile README.','Ensure each pinned repo has a clear README.','Contribute to 1–2 open-source issues.'];
  state.portfolio.report={li,gh,consistency,overall,liFixes,ghFixes};
  render(false);
  toast('Portfolio analyzed','success');
};

  if(e.key==='Escape'&&state.searchOpen)closeSearch();
  if(e.key==='Escape'&&state.activeTest&&!state.activeTest.submitted){
    if(confirm('Exit the test? Your progress will be lost.')){state.activeTest=null;clearInterval(_timer);go('tests')}
  }
});
window.addEventListener('beforeunload',()=>{persist()});
