<script>
/* ════════════════════════════════════════════════════════════════
   SKILLPATH — Complete placement prep LMS
   ════════════════════════════════════════════════════════════════ */


/* ── Utilities ── */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brandLogo=(size,extraClass='')=>`<img src="./assets/skillpath-logo.jpg" alt="" width="${size}" height="${size}" class="brand-logo ${extraClass}" style="width:${size}px;height:${size}px"/>`;
const supabaseConfig=window.SKILLPATH_SUPABASE_CONFIG||{};
const supabaseClient=window.supabase?.createClient&&supabaseConfig.url&&supabaseConfig.anonKey
  ?window.supabase.createClient(supabaseConfig.url,supabaseConfig.anonKey)
  :null;
try{localStorage.removeItem('skillpath.gemini')}catch(error){console.warn('Could not clear a browser-stored AI key:',error)}

const translatedSource=new WeakMap();
const translatedAttributes=new WeakMap();
const translationCache=new Map();
const TRANSLATION_CONSENT_KEY='skillpath.translation-consent';

async function requestAI(action,payload){
  if(!supabaseClient||!state.user?.authenticated)throw new Error('Configure Supabase and sign in to use AI features.');
  const{data,error}=await supabaseClient.functions.invoke('ai-assistant',{body:{action,payload}});
  if(error){
    let detail='';
    try{detail=(await error.context?.json())?.error||''}catch{}
    throw new Error(detail||error.message||'The AI request failed.');
  }
  if(data?.error)throw new Error(data.error);
  if(!data||!Object.hasOwn(data,'result'))throw new Error('The AI service returned an invalid response.');
  return data.result;
}

let pdfJsPromise;
async function loadPdfJs(){
  if(!pdfJsPromise){
    pdfJsPromise=new Promise((resolve,reject)=>{
      const script=document.createElement('script');
      script.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
      script.onload=()=>{
        if(!window.pdfjsLib){reject(new Error('The PDF reader could not be initialized.'));return}
        window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        resolve(window.pdfjsLib);
      };
      script.onerror=()=>reject(new Error('Could not load the PDF reader. Check your internet connection and try again.'));
      document.head.appendChild(script);
    }).catch(error=>{pdfJsPromise=null;throw error});
  }
  return pdfJsPromise;
}

async function extractPdfText(file){
  const pdfjs=await loadPdfJs();
  const documentTask=pdfjs.getDocument({data:new Uint8Array(await file.arrayBuffer())});
  const pdf=await documentTask.promise;
  try{
    if(pdf.numPages>20)throw new Error('This PDF has more than 20 pages. Upload a shorter resume.');
    const pages=[];
    let length=0;
    for(let pageNumber=1;pageNumber<=pdf.numPages;pageNumber++){
      const page=await pdf.getPage(pageNumber);
      const content=await page.getTextContent();
      const text=content.items.map(item=>typeof item.str==='string'?item.str:'').filter(Boolean).join(' ').trim();
      if(text){pages.push(`[Page ${pageNumber}]\n${text}`);length+=text.length}
      if(length>16000)break;
    }
    const extracted=pages.join('\n\n').slice(0,16000).trim();
    if(!extracted)throw new Error('No selectable text was found. This may be a scanned PDF; upload a text-based PDF instead.');
    return extracted;
  }finally{
    await pdf.destroy();
  }
}

let translationRunning=false;
let translationQueued=false;
function translateCurrentView(){
  translationQueued=true;
  if(translationRunning)return;
  translationRunning=true;
  void (async()=>{
    try{
      while(translationQueued){
        translationQueued=false;
        await translateCurrentViewNow();
      }
    }finally{
      translationRunning=false;
      if(translationQueued)translateCurrentView();
    }
  })();
}

function splitTranslationText(text,maxLength=500){
  const chunks=[];
  let start=0;
  while(start<text.length){
    let end=Math.min(start+maxLength,text.length);
    if(end<text.length){
      const boundary=text.lastIndexOf(' ',end-1);
      if(boundary>start)end=boundary+1;
      if(/[\uD800-\uDBFF]/.test(text[end-1]||'')&&/[\uDC00-\uDFFF]/.test(text[end]||''))end--;
    }
    chunks.push(text.slice(start,end));
    start=end;
  }
  return chunks;
}

async function translateCurrentViewNow(){
  if(state.lang!=='hi')return;
  if(!supabaseClient||!state.user?.authenticated){
    toast('हिंदी अनुवाद के लिए अपने छात्र खाते में साइन इन करें।','info',4500);
    return;
  }
  const roots=[$('#mainContent'),$('#topbar'),$('#modalRoot'),$('#toasts')].filter(Boolean);
  if(!roots.length)return;
  const targets=[];
  for(const root of roots){
   const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{
    acceptNode(node){
      const parent=node.parentElement;
      if(!parent||!node.textContent.trim()||parent.closest('svg,script,style,textarea,input,select,option,pre,code,.resume-doc,[data-no-translate]'))return NodeFilter.FILTER_REJECT;
      return NodeFilter.FILTER_ACCEPT;
    }
  });
  while(walker.nextNode()){
    const node=walker.currentNode;
    targets.push({node,get:()=>translatedSource.get(node)||node.textContent,set:value=>{translatedSource.set(node,translatedSource.get(node)||node.textContent);node.textContent=value}});
  }
  root.querySelectorAll('[placeholder],[title],[aria-label]').forEach(element=>{
    ['placeholder','title','aria-label'].forEach(attribute=>{
      const value=element.getAttribute(attribute);
      if(!value?.trim()||element.closest('[data-no-translate]'))return;
      let originals=translatedAttributes.get(element);
      if(!originals){originals=new Map();translatedAttributes.set(element,originals)}
      targets.push({
        node:element,
        get:()=>originals.get(attribute)||value,
        set:translated=>{if(!originals.has(attribute))originals.set(attribute,value);element.setAttribute(attribute,translated)}
      });
    });
   });
  }
  const sourceGroups=new Map();
  targets.forEach(target=>{
    const original=target.get();
    const cached=translationCache.get(original);
    if(cached){target.set(cached);return}
    const group=sourceGroups.get(original)||{targets:[],chunks:splitTranslationText(original)};
    group.targets.push(target);
    sourceGroups.set(original,group);
  });
  const pendingFragments=new Set();
  for(const group of sourceGroups.values())for(const chunk of group.chunks)pendingFragments.add(chunk);
  const fragments=[...pendingFragments];
  const batches=[];
  let batch=[];
  for(const fragment of fragments){
    const candidate=[...batch,fragment];
    if(batch.length&&(candidate.length>40||JSON.stringify({action:'translate_page',payload:{strings:candidate}}).length>18000)){
      batches.push(batch);
      batch=[fragment];
    }else batch=candidate;
  }
  if(batch.length)batches.push(batch);
  const translatedFragments=new Map();
  for(const batch of batches){
    try{
      const result=await requestAI('translate_page',{strings:batch});
      const translations=result?.translations;
      if(!Array.isArray(translations)||translations.length!==batch.length||translations.some(text=>typeof text!=='string'||!text.trim())){
        throw new Error('Translation response did not match the displayed text.');
      }
      batch.forEach((text,index)=>translatedFragments.set(text,translations[index]));
    }catch(error){
      console.error('Hindi page translation failed:',error);
      if(state.lang==='hi')toast('पृष्ठ का हिंदी में अनुवाद नहीं हो सका। कृपया थोड़ी देर बाद फिर प्रयास करें।','error',5000);
      return;
    }
  }
  for(const [original,group] of sourceGroups){
    const translated=group.chunks.map(chunk=>translatedFragments.get(chunk)).join('');
    translationCache.set(original,translated);
    group.targets.forEach(target=>{if(target.node.isConnected)target.set(translated)});
  }
}
const fmtT=s=>`${String(Math.floor(s/60)).padStart(2,'0')}:${String(Math.max(0,s%60)).padStart(2,'0')}`;
const fmtD=(d=new Date())=>new Date(d).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});
const rel=iso=>{const d=new Date(iso),n=Date.now(),s=(n-d)/1000;if(s<60)return'just now';if(s<3600)return`${Math.floor(s/60)}m ago`;if(s<86400)return`${Math.floor(s/3600)}h ago`;if(s<604800)return`${Math.floor(s/86400)}d ago`;return fmtD(iso)};
const ini=n=>(n||'').split(' ').map(p=>p[0]).slice(0,2).join('').toUpperCase();
const uid=()=>Math.random().toString(36).slice(2,10);
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const shuffle=a=>{const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};


/* ── i18n ── */
const I18N={
  en:{dashboard:'Dashboard',learning:'Learning',tests:'Tests',analytics:'Analytics',code:'Code Practice',interview:'Mock Interview',resume:'Resume Builder',analyzer:'Resume Analyzer',companies:'Companies',jobs:'Job Board',leaderboard:'Leaderboard',badges:'Achievements',community:'Community',gd:'Group Discussion',fluency:'Fluency Lab',studyplan:'Study Plan',formulas:'Formula Cards',drive:'Mock Drives',certificates:'Certificates',portfolio:'Portfolio',overview:'Overview',practice:'Practice',career:'Career',social:'Community',manage:'Manage',content:'Content'},
  hi:{dashboard:'डैशबोर्ड',learning:'लर्निंग',tests:'टेस्ट',analytics:'एनालिटिक्स',code:'कोड प्रैक्टिस',interview:'मॉक इंटरव्यू',resume:'रेज़्यूमे बिल्डर',analyzer:'रेज़्यूमे एनालाइज़र',companies:'कंपनियाँ',jobs:'जॉब बोर्ड',leaderboard:'लीडरबोर्ड',badges:'उपलब्धियाँ',community:'कम्युनिटी',gd:'ग्रुप डिस्कशन',fluency:'फ्लुएंसी लैब',studyplan:'स्टडी प्लान',formulas:'फॉर्मूला कार्ड्स',drive:'मॉक ड्राइव',certificates:'सर्टिफिकेट',portfolio:'पोर्टफोलियो',overview:'अवलोकन',practice:'अभ्यास',career:'करियर',social:'कम्युनिटी',manage:'प्रबंधन',content:'सामग्री'}
};
function t(k){return (I18N[state.lang]&&I18N[state.lang][k])||I18N.en[k]||k}
window.toggleLang=()=>{
  if(state.lang!=='hi'&&(!supabaseClient||!state.user?.authenticated)){
    toast('Sign in to translate the full page into Hindi.','info',4000);
    return;
  }
  if(state.lang!=='hi'&&!localStorage.getItem(TRANSLATION_CONSENT_KEY)){
    if(!confirm('Visible page text will be sent to the configured AI service for Hindi translation. Continue?'))return;
    localStorage.setItem(TRANSLATION_CONSENT_KEY,'1');
  }
  state.lang=state.lang==='hi'?'en':'hi';
  persist();render(true);
  toast(state.lang==='hi'?'भाषा: हिंदी':'Language: English','info',1400);

/* ── Toast ── */
function toast(msg,kind='info',ms=3400){
  const icons={info:'ℹ',success:'✓',error:'✕',warn:'⚠',sparkle:'✨'};
  const colors={info:'border-brand-500/50 text-brand-300',success:'border-good/50 text-good',error:'border-bad/50 text-bad',warn:'border-warn/50 text-warn',sparkle:'border-lime/50 text-lime'};
  const el=document.createElement('div');
  el.className=`toast-enter card px-4 py-3 text-sm flex items-center gap-3 ${colors[kind]||colors.info} shadow-soft`;
  el.innerHTML=`<span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold border border-current shrink-0">${icons[kind]||icons.info}</span><span class="text-slate-200 flex-1">${esc(msg)}</span>`;
  $('#toasts').appendChild(el);
  setTimeout(()=>{el.style.transition='all .3s';el.style.opacity='0';el.style.transform='translateX(20px)';setTimeout(()=>el.remove(),320)},ms);
}


/* ── Modal ── */
function modal({title,body,actions=[],size='md'}){
  const sizes={sm:'max-w-md',md:'max-w-lg',lg:'max-w-2xl',xl:'max-w-4xl',full:'max-w-6xl'};
  const el=document.createElement('div');
  el.className='fixed inset-0 z-[90] flex items-center justify-center p-4';
  el.style.animation='fadeIn .3s ease both';
  el.innerHTML=`<div class="absolute inset-0 bg-black/75 backdrop-blur-sm" data-close></div>
    <div class="relative card ${sizes[size]} w-full shadow-soft max-h-[92vh] overflow-hidden flex flex-col" style="animation:slideUp .4s cubic-bezier(.16,1,.3,1) both">
      <div class="p-5 border-b border-ink-650 flex items-center justify-between shrink-0">
        <h3 class="text-white font-bold text-lg">${esc(title)}</h3>
        <button data-close class="text-slate-400 hover:text-white text-2xl leading-none px-2 -mr-2">×</button>
      </div>
      <div class="p-6 overflow-y-auto flex-1">${body}</div>
      ${actions.length?`<div class="p-5 border-t border-ink-650 flex gap-3 justify-end shrink-0 bg-ink-850/60">${actions.map((a,i)=>`<button data-action="${i}" class="${a.class||'btn-ghost card-flat px-5 py-2.5 rounded-xl text-sm text-slate-200'}">${a.label}</button>`).join('')}</div>`:''}
    </div>`;
  $('#modalRoot').appendChild(el);
  const close=()=>el.remove();
  el.addEventListener('click',e=>{
    if(e.target.hasAttribute('data-close'))return close();
    const i=e.target.closest('[data-action]')?.getAttribute('data-action');
    if(i!==null&&i!==undefined){const a=actions[+i];if(a.onClick&&a.onClick()===false)return;close()}
  });
  return{close};
}
function confirmDialog(msg,onYes,opts={}){modal({title:opts.title||'Confirm',body:`<p class="text-slate-300 leading-relaxed">${esc(msg)}</p>`,actions:[{label:'Cancel',class:'btn-ghost card-flat px-5 py-2.5 rounded-xl text-sm text-slate-300'},{label:opts.yesLabel||'Confirm',class:'btn-primary text-white px-5 py-2.5 rounded-xl text-sm font-semibold',onClick:onYes}]})}


/* ── Confetti ── */
function confetti(n=60){
  const cols=['#7c5cff','#60a5fa','#34d399','#fbbf24','#f472b6','#22d3ee','#c4b5fd'];
  for(let i=0;i<n;i++){
    const p=document.createElement('div');p.className='confetti';
    const s=6+Math.random()*8;
    p.style.cssText=`width:${s}px;height:${s}px;background:${cols[i%cols.length]};left:50%;top:38%;border-radius:${Math.random()>.5?'50%':'2px'}`;
    p.style.setProperty('--tx',(Math.random()-.5)*600+'px');
    p.style.setProperty('--ty',(300+Math.random()*500)+'px');
    p.style.setProperty('--rot',(Math.random()*720-360)+'deg');
    p.style.animation=`confettiFall ${1.2+Math.random()*1}s cubic-bezier(.2,.6,.3,1) forwards`;
    $('#fxRoot').appendChild(p);
    setTimeout(()=>p.remove(),2400);
  }
}


/* ── Ripple ── */
document.addEventListener('click',e=>{
  const b=e.target.closest('.btn-primary,.btn-ghost,.ripple-on');
  if(!b)return;
  const r=b.getBoundingClientRect();
  const rip=document.createElement('span');rip.className='ripple';
  const size=Math.max(r.width,r.height);
  rip.style.cssText=`width:${size}px;height:${size}px;left:${e.clientX-r.left-size/2}px;top:${e.clientY-r.top-size/2}px`;
  b.appendChild(rip);
  setTimeout(()=>rip.remove(),700);
});


/* ── Number counter ── */
function animateNum(el,to,dur=900,decimals=0){
  const start=performance.now();
  const tick=now=>{
    const p=Math.min(1,(now-start)/dur);
    const eased=1-Math.pow(1-p,3);
    const v=to*eased;
    el.textContent=decimals?v.toFixed(decimals):Math.round(v).toLocaleString();
    if(p<1)requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}


/* ── Tilt ── */
function attachTilt(){
  $$('.tilt').forEach(card=>{
    if(card.dataset.tiltBound)return;
    card.dataset.tiltBound='1';
    card.addEventListener('mousemove',e=>{
      const r=card.getBoundingClientRect();
      const x=(e.clientX-r.left)/r.width-.5;
      const y=(e.clientY-r.top)/r.height-.5;
      card.style.transform=`perspective(900px) rotateY(${x*6}deg) rotateX(${-y*6}deg) translateZ(6px)`;
    });
    card.addEventListener('mouseleave',()=>{card.style.transform=''});
  });
}


/* ── Reveals ── */
let _observer=null;
function attachReveals(){
  if(_observer)_observer.disconnect();
  _observer=new IntersectionObserver(entries=>{
    entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('visible');_observer.unobserve(e.target)}});
  },{threshold:.08,rootMargin:'0px 0px -40px 0px'});
  $$('.reveal').forEach(el=>_observer.observe(el));
}

    seen = {}

/* ════════════════════════════════════════════════════════════════
   COMPUTED METRICS
   ════════════════════════════════════════════════════════════════ */
function computeReadiness(){
  const att=state.attempts;
  const tS=att.reduce((a,x)=>a+x.score,0),tQ=att.reduce((a,x)=>a+x.total,0);
  const mcq=tQ?(tS/tQ)*100:0;
  let done=0,tot=0;
  for(const l of currentLearningCourses())for(const m of l.modules){tot++;if(state.lessonProgress[l.id]?.[m.id])done++}
  const learn=tot?(done/tot)*100:0;
  const rolePractice=isCodeCareer()
    ?Math.min(100,state.codeSubs.filter(s=>s.status==='passed').length/Math.max(1,careerCodingProblems().length)*100)
    :Math.min(100,Object.values(state.formulaKnown||{}).filter(Boolean).length/Math.max(1,careerFormulas().length)*100);
  const intv=Math.min(100,state.interviews.length*20);
  const resume=state.analyzer?.score||0;
  const score=Math.round(mcq*0.4+learn*0.25+rolePractice*0.15+intv*0.1+resume*0.1);
  return{score:clamp(score,0,100),parts:[
    {key:'mcq',label:'Assessment accuracy',value:Math.round(mcq),weight:40},
    {key:'learn',label:'Role learning progress',value:Math.round(learn),weight:25},
    {key:'practice',label:isCodeCareer()?'Code practice':'Role formula revision',value:Math.round(rolePractice),weight:15},
    {key:'intv',label:'Mock interviews',value:Math.round(intv),weight:10},
    {key:'resume',label:'Resume quality',value:Math.round(resume),weight:10}
  ]}
}
function topicStats(){
  const agg={};
  for(const a of state.attempts)for(const[t,v]of Object.entries(a.topics||{})){
    agg[t]=agg[t]||{c:0,t:0};agg[t].c+=v.c;agg[t].t+=v.t;
  }
  return Object.entries(agg).map(([topic,v])=>({topic,correct:v.c,total:v.t,pct:v.t?Math.round(v.c/v.t*100):0})).sort((a,b)=>b.pct-a.pct);
}
function learningTopicStats(){
  return currentLearningCourses().flatMap(course=>course.modules.map(module=>({
    courseId:course.id,courseTitle:course.title,courseIcon:course.icon,moduleId:module.id,
    topic:module.title,complete:Boolean(state.lessonProgress[course.id]?.[module.id])
  })));
}
function computePoints(){
  let p=0;
  for(const a of state.attempts)p+=a.score*10;
  for(const l of currentLearningCourses())for(const m of l.modules)if(state.lessonProgress[l.id]?.[m.id])p+=15;
  if(isCodeCareer())p+=state.codeSubs.filter(s=>s.status==='passed').length*50;
  p+=state.interviews.length*40;
  if(state.analyzer)p+=30;
  return p;
}
function computeStreak(){
  const activityDays=new Set(state.activity.map(item=>{
    const date=new Date(item.at);
    return Number.isNaN(date.getTime())?'':`${date.getFullYear()}-${date.getMonth()}-${date.getDate()}`;
  }).filter(Boolean));
  const dayOffset=date=>new Date(date.getFullYear(),date.getMonth(),date.getDate());
  const today=dayOffset(new Date());
  let cursor=today;
  const key=date=>`${date.getFullYear()}-${date.getMonth()}-${date.getDate()}`;
  if(!activityDays.has(key(cursor))){cursor.setDate(cursor.getDate()-1);if(!activityDays.has(key(cursor)))return 0}
  let streak=0;
  while(activityDays.has(key(cursor))){streak++;cursor.setDate(cursor.getDate()-1)}
  return streak;
}
function computeLeaderboard(){
  const myPts=computePoints();
  const me={name:state.user?.name||'You',batch:state.user?.batch||'—',points:myPts,solved:state.codeSubs.filter(s=>s.status==='passed').length,streak:computeStreak(),avatar:state.user?.avatar||ini(state.user?.name||'You'),isMe:true};
  return[me];
}
function isLessonComplete(l){return l.modules.every(m=>state.lessonProgress[l.id]?.[m.id])}

async function loadAuthenticatedUser(authUser){
  const{data:profile,error}=await supabaseClient.from('profiles')
    .select('id,display_name,role,field_of_study,target_role,target_salary')
    .eq('id',authUser.id).maybeSingle();
  if(error)throw new Error(`Could not load your profile. Apply the Supabase profile migration and retry: ${error.message}`);
  if(!profile)throw new Error('Your student profile was not created. Apply the Supabase profile migration, then sign in again.');
  if(!['student','trainer','admin'].includes(profile.role))throw new Error('Your account has an invalid role. Ask an administrator to review your profile.');
  const name=profile.display_name||authUser.user_metadata?.display_name||authUser.email||'Student';
  state.user={
    id:profile.id,name,email:authUser.email||'',role:profile.role,
    batch:'—',avatar:ini(name),authenticated:true,
    fieldOfStudy:profile.field_of_study||'',targetRole:profile.target_role||'',targetSalary:profile.target_salary||''
  };
  state.communityPeers=[];state.communityProfiles=[];state.chatRequests=[];state.communityThreads=[];
  state.communityLoaded=false;state.communityLoading=false;state.communityError='';
  state.view=profile.role==='admin'?'admin':profile.role==='student'&&!profile.target_role?'career-goal':'dashboard';
  persist();
  render(true);
}
window.submitAuth=async event=>{
  event.preventDefault();
  if(!supabaseClient){toast('Supabase is not configured. Check supabase-config.js and reload.','error');return}
  const signup=!$('#signupNameWrap').classList.contains('hidden');
  const email=$('#authEmail').value.trim();
  const password=$('#authPassword').value;
  const name=$('#authName').value.trim();
  const button=$('#authSubmit');
  if(signup&&!name){toast('Enter your name to create an account.','error');return}
  button.disabled=true;
  try{
    if(signup){
      const{data,error}=await supabaseClient.auth.signUp({
        email,password,options:{data:{display_name:name},emailRedirectTo:location.href.split('#')[0]}
      });
      if(error)throw error;
      if(!data.session){
        toast('Check your email to confirm your student account, then sign in.','success',6000);
        setAuthMode('signin');
        return;
      }
      await loadAuthenticatedUser(data.user);
      toast('Student account created successfully.','success',5000);
    }else{
      const{data,error}=await supabaseClient.auth.signInWithPassword({email,password});
      if(error)throw error;
      await loadAuthenticatedUser(data.user);
      toast(`Welcome, ${state.user.name.split(' ')[0]}!`,'success');
    }
  }catch(error){toast(`Authentication failed: ${error.message}`,'error',7000)}
  finally{button.disabled=false}
};

function viewDashboard(){

  const recent=state.activity.slice(0,6);
  const trend=state.attempts.slice(-8);


  const W=560,H=140,padX=30,padY=22;
  const pts=trend.map((a,i)=>{
    const x=padX+(i/Math.max(1,trend.length-1))*(W-padX*2);
    const y=H-padY-(a.score/a.total)*(H-padY*2);
    return[x,y];
  });
  const linePath=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const areaPath=pts.length?`${linePath} L ${pts[pts.length-1][0]} ${H-padY} L ${pts[0][0]} ${H-padY} Z`:'';


  const ring=(pct,size=180,stroke=13)=>{
    const rr=(size-stroke)/2,c=2*Math.PI*rr;
    return`<svg width="${size}" height="${size}" class="block drop-shadow-[0_0_32px_rgba(124,92,255,0.4)]">

      <circle cx="${size/2}" cy="${size/2}" r="${rr}" stroke="#1a2138" stroke-width="${stroke}" fill="none"/>
      <circle cx="${size/2}" cy="${size/2}" r="${rr}" class="ring-fill" stroke-width="${stroke}" fill="none"
        stroke-dasharray="${c}" stroke-dashoffset="${c}" stroke-linecap="round"
        data-ring="${pct}" data-r="${rr}" style="transform:rotate(-90deg);transform-origin:${size/2}px ${size/2}px"/>

  return layout(`
    <div class="space-y-6">
      <div class="flex flex-wrap items-end justify-between gap-4 reveal">
        <div>
          <div class="text-slate-500 text-xs tracking-wider uppercase font-semibold">${new Date().toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long'})}</div>

        </div>
      </div>


      <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 md:gap-4 stagger">

window.toggleBookmark=id=>{state.bookmarks[id]=!state.bookmarks[id];render(false);toast(state.bookmarks[id]?'Bookmarked':'Bookmark removed','success',1600)};
window.downloadLessonOffline=(lessonId)=>{
  const l=currentLearningCourses().find(x=>x.id===lessonId);if(!l)return;
  const text=`SkillPath · ${l.title}\n${'='.repeat(60)}\n\nCategory: ${l.cat}\nModules: ${l.modules.length}\n\n`+l.modules.map((m,i)=>`\n${'-'.repeat(50)}\nMODULE ${i+1}: ${m.title}\n${m.dur}\n${'-'.repeat(50)}\n\n${m.body.replace(/<[^>]*>/g,'')}\n`).join('\n');
  const blob=new Blob([text],{type:'text/plain'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`SkillPath_${l.title.replace(/\s+/g,'_')}.txt`;a.click();
  URL.revokeObjectURL(a.href);
  toast('Lesson downloaded for offline reading','success');
};

  const modIdx=l.modules.indexOf(mod);


  return layout(`
    <div class="space-y-5">
      <div class="flex items-center gap-3 reveal">
        <button onclick="go('learning')" class="btn-ghost card-flat px-3 py-2 rounded-lg text-sm text-slate-300">←</button>

          ${l.modules.map((m,i)=>{
            const mdone=state.lessonProgress[l.id]?.[m.id];
            const active=m.id===mod.id;
            return`<button onclick="go('lesson',{id:'${l.id}',mod:'${m.id}'})" class="w-full text-left card-flat p-3 hover:border-brand-500/50 transition ${active?'border-brand-500/60 bg-brand-500/5':''}">
              <div class="flex items-start gap-3">
                <div class="w-6 h-6 rounded-md ${mdone?'bg-good/25 text-good':active?'bg-brand-500/25 text-brand-300':'bg-ink-700 text-slate-500'} flex items-center justify-center text-[11px] font-bold shrink-0 mt-0.5">${mdone?'✓':i+1}</div>
                <div class="min-w-0">
                  <div class="text-sm ${active?'text-white font-semibold':'text-slate-300'} truncate">${esc(m.title)}</div>
                  <div class="text-[10px] text-slate-500 mt-0.5">${m.dur}</div>
                </div>
              </div>
            </button>`}).join('')}

        <div class="lg:col-span-3 card p-6 md:p-8 reveal">
          <div class="flex items-center justify-between mb-5 pb-5 border-b border-ink-650 flex-wrap gap-3">

              <h2 class="text-xl font-bold text-white mt-1">${esc(mod.title)}</h2>
              <div class="text-xs text-slate-500 mt-1">~${mod.dur} read time</div>
            </div>
            <button onclick="toggleModuleDone('${l.id}','${mod.id}')" class="text-xs px-4 py-2.5 rounded-lg transition font-semibold ${state.lessonProgress[l.id]?.[mod.id]?'bg-good/15 text-good border border-good/30 hover:bg-good/25':'btn-primary text-white'}">
              ${state.lessonProgress[l.id]?.[mod.id]?'✓ Completed':'Mark complete'}
            </button>
          </div>


          <div class="text-slate-300 leading-relaxed space-y-4 text-[15px]">

              let html=esc(pp)
                .replace(/&lt;strong&gt;/g,'<strong class="text-white">').replace(/&lt;\/strong&gt;/g,'</strong>')
                .replace(/&lt;em&gt;/g,'<em class="text-brand-200 not-italic font-medium">').replace(/&lt;\/em&gt;/g,'</em>');
              return`<p>${html}</p>`;
            }).join('')}

          <div class="mt-8 pt-6 border-t border-ink-650 flex items-center justify-between gap-3 flex-wrap">

            ${modIdx===l.modules.length-1
              ?isLessonComplete(l)
                ?`<button onclick="go('certificates')" class="btn-primary text-white px-5 py-2.5 rounded-lg text-sm font-semibold">View your certificate →</button>`
                :`<button onclick="finishLesson('${l.id}','${mod.id}')" class="btn-primary text-white px-5 py-2.5 rounded-lg text-sm font-semibold">Finish course →</button>`
              :`<button onclick="go('lesson',{id:'${l.id}',mod:'${l.modules[modIdx+1].id}'})" class="btn-primary text-white px-5 py-2.5 rounded-lg text-sm font-semibold">Next module →</button>`}

window.finishLesson=(lessonId,moduleId)=>{
  const lesson=currentLearningCourses().find(item=>item.id===lessonId);
  if(!lesson||!lesson.modules.some(module=>module.id===moduleId)){
    toast('This learning module is unavailable.','error');
    return;
  }
  state.lessonProgress[lessonId]=state.lessonProgress[lessonId]||{};
  if(!state.lessonProgress[lessonId][moduleId]){
    state.lessonProgress[lessonId][moduleId]=true;
    state.activity.unshift({type:'lesson',icon:'📚',color:'from-violet-500 to-purple-600',text:`Completed a lesson in <b>${esc(lesson.title)}</b>`,at:new Date().toISOString(),id:uid()});
    if(!state.badges.includes('b1'))state.badges.push('b1');
  }
  if(!isLessonComplete(lesson)){
    render(false);
    toast('Complete the remaining modules to earn this certificate.','info',3500);
    return;
  }
  confetti(40);
  toast(`${lesson.title} course completed! Your certificate is ready.`,'success',4000);
  go('certificates');
};
window.toggleModuleDone=(lid,mid)=>{
  state.lessonProgress[lid]=state.lessonProgress[lid]||{};
  state.lessonProgress[lid][mid]=!state.lessonProgress[lid][mid];
  if(state.lessonProgress[lid][mid]){
    confetti(40);
    toast('Module complete! +15 points','success');
    state.activity.unshift({type:'lesson',icon:'📚',color:'from-violet-500 to-purple-600',text:`Completed a lesson in <b>${esc(currentLearningCourses().find(l=>l.id===lid)?.title||currentCareer().role)}</b>`,at:new Date().toISOString(),id:uid()});
    if(!state.badges.includes('b1')){state.badges.push('b1');toast('🏅 Badge unlocked: First Steps','sparkle')}
  }
  render(false);
};

window.startTest=async catId=>{
  const fmap={quant:q=>q.cat==='Quantitative',logic:q=>q.cat==='Logical',verbal:q=>q.cat==='Verbal',tech:q=>q.cat==='Technical'};
  const names={quant:'Quantitative Aptitude',logic:'Logical Reasoning',verbal:'Verbal Ability',tech:'Technical — Core CS'};
  let pool=[];
  let testName=names[catId];
  if(catId==='career'){
    testName=`${currentCareer().role} Skills`;
    pool=shuffle(ROLE_TESTS[currentCareer().id]||[]);
    if(state.user?.authenticated){
      try{
        const result=await requestAI('generate_test',{
          role:currentCareer().role,field:currentCareer().field,topic:currentCareer().skills.join(', '),count:8
        });
        const generated=result?.questions;
        if(!Array.isArray(generated)||generated.length<3||generated.some(q=>
          typeof q.q!=='string'||!Array.isArray(q.options)||q.options.length!==4||
          !Number.isInteger(q.answerIndex)||q.answerIndex<0||q.answerIndex>3||
          typeof q.explanation!=='string'||typeof q.topic!=='string'
        ))throw new Error('The AI service returned questions in an unsupported format.');
        pool=generated.map(q=>({q:q.q,opts:q.options,ans:q.answerIndex,exp:q.explanation,topic:q.topic,cat:'Career'}));
        testName+=` · AI`;
      }catch(error){
        console.warn('AI quiz generation failed; using the reviewed role question set instead.',error);
      }
    }
    if(!state.user?.authenticated)toast('Using the built-in role-specific question set. Sign in to generate fresh Gemini questions.','info',5000);
  }else{
    if(!fmap[catId]){toast('This test category is unavailable.','error');return}
    pool=shuffle(QUESTIONS.filter(fmap[catId])).slice(0,8);
  }
  if(!pool.length){toast('No questions are available for this career path yet.','error',5000);return}
  const perQ=60;
  state.activeTest={catId,name:testName,questions:pool,answers:new Array(pool.length).fill(null),idx:0,secondsLeft:pool.length*perQ,total:pool.length*perQ,submitted:false,startedAt:Date.now(),tabSwitches:0};
  go('test-active');
  startTimer();
  toast('Test started. Good luck!','info',2000);
};
let _timer=null;
function startTimer(){
  clearInterval(_timer);
  _timer=setInterval(()=>{
    const t=state.activeTest;
    if(!t||t.submitted){clearInterval(_timer);return}
    t.secondsLeft--;
    if(t.secondsLeft<=0){t.secondsLeft=0;clearInterval(_timer);submitTest(true);return}
    const timerEl=$('#testTimer');
    if(timerEl){
      timerEl.textContent=fmtT(t.secondsLeft);
      timerEl.classList.toggle('text-bad',t.secondsLeft<60);
      timerEl.classList.toggle('text-white',t.secondsLeft>=60);
    }
    const bar=$('#testBar');
    if(bar)bar.style.width=(t.secondsLeft/t.total*100)+'%';
  },1000);
}
window.pickAnswer=i=>{state.activeTest.answers[state.activeTest.idx]=i;render(false)};
window.gotoQ=i=>{state.activeTest.idx=i;render(false)};
window.nextQ=()=>{if(state.activeTest.idx<state.activeTest.questions.length-1){state.activeTest.idx++;render(false)}};
window.prevQ=()=>{if(state.activeTest.idx>0){state.activeTest.idx--;render(false)}};
window.submitTest=auto=>{
  const t=state.activeTest;if(!t||t.submitted)return;
  if(!auto){
    const un=t.answers.filter(a=>a===null).length;
    if(un>0){confirmDialog(`You have ${un} unanswered question(s). Submit anyway?`,()=>doSubmit(),{yesLabel:'Submit'});return}
  }
  doSubmit();
};
function doSubmit(){
  const t=state.activeTest;if(!t||t.submitted)return;
  t.submitted=true;clearInterval(_timer);
  let score=0;const topics={};
  t.questions.forEach((q,i)=>{
    const ok=t.answers[i]===q.ans;
    if(ok)score++;
    topics[q.topic]=topics[q.topic]||{c:0,t:0};topics[q.topic].t++;if(ok)topics[q.topic].c++;
  });
  const timeSec=Math.round((Date.now()-t.startedAt)/1000);
  const attempt={id:'a'+uid(),testName:t.name+` — Set ${state.attempts.length+1}`,date:new Date().toISOString(),score,total:t.questions.length,timeSec,topics,tabSwitches:t.tabSwitches||0};
  state.attempts.push(attempt);
  t.result=attempt;
  const pct=Math.round(score/t.questions.length*100);
  if(pct>=90&&!state.badges.includes('b9')){state.badges.push('b9');setTimeout(()=>toast('🏅 Badge unlocked: Sharp Shooter','sparkle'),900)}
  if(pct===100&&!state.badges.includes('b11')){state.badges.push('b11');setTimeout(()=>toast('🏅 Badge unlocked: Perfect Run','sparkle'),1200)}
  if(pct>=70&&!state.badges.includes('b2')){state.badges.push('b2')}
  state.activity.unshift({type:'test',icon:'📝',color:'from-sky-500 to-cyan-600',text:`Scored <b>${pct}%</b> on ${t.name}`,at:new Date().toISOString(),id:uid()});
  if(pct>=70)confetti(60);
  render(false);
  toast(`Test submitted — ${score}/${t.questions.length} (${pct}%)`,pct>=70?'success':'info');
}
window.closeTest=()=>{state.activeTest=null;clearInterval(_timer);go('tests')};

function viewAnalytics(){

window.uploadResumePdf=()=>{
  if(state.analyzer?.loading)return;
  if(!state.user?.authenticated){
    toast('Sign in to analyze a PDF resume with Gemini.','info',5000);
    return;
  }
  const input=document.createElement('input');
  input.type='file';
  input.accept='.pdf,application/pdf';
  input.onchange=async()=>{
    const file=input.files?.[0];
    if(!file)return;
    if(!/\.pdf$/i.test(file.name)){
      toast('Choose a PDF file to analyze.','error',5000);
      return;
    }
    if(file.size>12*1024*1024){
      toast('This PDF is larger than 12 MB. Choose a smaller resume file.','error',5000);
      return;
    }
    if((await file.slice(0,5).text())!=='%PDF-'){
      toast('This file does not appear to be a valid PDF.','error',5000);
      return;
    }
    state.analyzer={loading:true,sourceName:file.name,checks:[],present:[],missing:[]};
    render(false);
    try{
      const resumeText=await extractPdfText(file);
      await window.runAnalyzer(resumeText,file.name);
    }catch(error){
      state.analyzer=null;
      render(false);
      toast(`Could not read this PDF: ${error.message}`,'error',6000);
    }
  };
  input.click();
};

window.runAnalyzer=async(resumeText='',sourceName='')=>{
  const r=state.resume;
  state.analyzer={loading:true,sourceName,checks:[],present:[],missing:[]};render(false);
  const checks=[
    {label:'Contact information complete',ok:!!(r.email&&r.phone&&r.location),pts:10,tip:'Include email, phone, and city.'},
    {label:'LinkedIn profile present',ok:!!r.linkedin,pts:5,tip:'Recruiters verify LinkedIn.'},
    {label:'Summary is 30+ words',ok:(r.summary||'').split(/\s+/).length>=30,pts:10,tip:'Write 2–3 sentences.'},
    {label:'6+ skills listed',ok:(r.skills||[]).length>=6,pts:10,tip:'List 6–12 skills.'},
    {label:'Education section present',ok:r.education.length>0,pts:10,tip:'Add degree, institution, score.'},
    {label:'At least 2 projects',ok:r.projects.length>=2,pts:15,tip:'Show 2–3 impact-focused projects.'},
    {label:'Experience or internship',ok:r.experience.length>0,pts:15,tip:'Even a short internship counts.'},
    {label:'Achievements section',ok:r.achievements.filter(Boolean).length>0,pts:10,tip:'Add awards, ranks, certs.'},
    {label:'Quantified results',ok:/\d+%|\d+x|\d+\+/.test((r.experience.map(e=>e.desc).join(' '))+(r.projects.map(p=>p.desc).join(' '))),pts:15,tip:'Use numbers.'}
  ];
  const skills=currentCareer().skills;
  const resumeSkills=(Array.isArray(r.skills)?r.skills:String(r.skills||'').split(',')).map(skill=>skill.trim().toLowerCase());
  const present=skills.filter(skill=>resumeSkills.some(resumeSkill=>resumeSkill.includes(skill.toLowerCase())));
  const missing=skills.filter(skill=>!present.includes(skill));
  const fallbackScore=checks.reduce((sum,check)=>sum+(check.ok?check.pts:0),0);
  try{
    if(!state.user?.authenticated){
      state.analyzer={score:fallbackScore,checks,present,missing,summary:'Local checklist estimate only. Sign in to request Gemini feedback grounded in your saved resume.',recommendations:[],isAI:false};
      toast('Showing the local resume checklist. Sign in to use Gemini analysis.','info',5000);
      return;
    }
    const result=await requestAI('analyze_resume',{
      role:currentCareer().role,field:currentCareer().field,
      ...(resumeText?{resumeText}:{resume:r})
    });
    if(!Number.isInteger(result?.score)||!Array.isArray(result.checks)||!Array.isArray(result.skillsPresent)||
      !Array.isArray(result.skillsMissing)||!Array.isArray(result.recommendations)){
      throw new Error('The AI service returned a resume report in an unsupported format.');
    }
    state.analyzer={
      ...result,score:clamp(result.score,0,100),
      checks:result.checks.map(check=>({label:String(check.label||''),ok:Boolean(check.ok),pts:Number(check.points)||0,tip:String(check.tip||check.evidence||'')})),
      present:result.skillsPresent.filter(skill=>typeof skill==='string'),
      missing:result.skillsMissing.filter(skill=>typeof skill==='string'),isAI:true
    };
    state.analyzer.sourceName=sourceName;
    state.activity.unshift({type:'resume-analysis',icon:'🔍',color:'from-cyan-500 to-blue-600',text:`Analyzed resume for <b>${esc(currentCareer().role)}</b>`,at:new Date().toISOString(),id:uid()});
    toast(`Gemini resume review complete — ${state.analyzer.score}/100.`,'success',4000);
  }catch(error){
    if(resumeText){
      state.analyzer={error:error.message,sourceName,checks:[],present:[],missing:[]};
      toast(`PDF analysis failed: ${error.message}`,'error',6000);
    }else{
      state.analyzer={error:error.message,score:fallbackScore,checks,present,missing,summary:'Gemini review failed; showing the local checklist estimate instead.',recommendations:[],isAI:false};
      toast(`Gemini resume analysis failed: ${error.message}. Showing the local checklist estimate.`,'error',6000);
    }
  }finally{state.analyzer.loading=false;render(false)}
};

  const a=state.analyzer;
  return layout(`
    <div class="space-y-6">
      <div class="reveal">
        <h1 class="text-2xl md:text-3xl font-black text-white tracking-tight">${t('analyzer')}</h1>
        <p class="text-slate-400 text-sm mt-1">Resume feedback for ${esc(currentCareer().role)}. Scores are guidance, not an ATS or hiring prediction.</p>

/* ════════════════════════════════════════════════════════════════
   INTERVIEW
   ════════════════════════════════════════════════════════════════ */
const INTERVIEW_BANK={
  hr:[
    {q:'Tell me about yourself.',hint:'Present → past → future. 60–90 seconds.'},
    {q:'Why do you want to join our company?',hint:'Reference a product, value, or practice.'},
    {q:'Where do you see yourself in five years?',hint:'Show ambition grounded in the role.'},
    {q:'What is your biggest weakness?',hint:'Real weakness + your system to improve.'},
    {q:'Tell me about a challenge you overcame.',hint:'Use STAR. Quantify the outcome.'},
    {q:'Why should we hire you?',hint:'Bridge strengths to role requirements.'},
    {q:'What do you know about our engineering culture?',hint:'Reference specific tech blogs.'},
    {q:'How do you handle feedback?',hint:'Concrete example of acting on feedback.'}
  ],
  technical:[
    {q:'Explain the difference between an array and a linked list.',hint:'Memory layout, access time, insertion cost.'},
    {q:'What happens when you type a URL in the browser?',hint:'DNS → TCP → TLS → HTTP → render.'},
    {q:'How would you detect a cycle in a linked list?',hint:'Floyd\'s cycle detection.'},
    {q:'Explain database indexing.',hint:'B-tree, write cost vs read speed.'},
    {q:'Process vs thread?',hint:'Address space, shared memory, switch cost.'},
    {q:'Time complexity of your favourite sort.',hint:'Best / avg / worst + space.'},
    {q:'Deadlock — what is it, how to prevent?',hint:'Four conditions + one strategy.'},
    {q:'REST vs GraphQL.',hint:'Over-fetching, schema, caching.'},
    {q:'What is the CAP theorem?',hint:'Consistency, Availability, Partition tolerance.'},
    {q:'How does a hashmap work internally?',hint:'Buckets, hash, collision, load factor.'}
  ],
  behavioral:[
    {q:'Describe a time you disagreed with a teammate.',hint:'Focus on the resolution.'},
    {q:'Tell me about a project you are proud of.',hint:'Problem, contribution, measurable outcome.'},
    {q:'How do you handle tight deadlines?',hint:'Prioritization framework + example.'},
    {q:'Give an example of learning something quickly.',hint:'Show the method, not just outcome.'},
    {q:'Tell me about a time you failed.',hint:'Own failure, show what changed.'},
    {q:'Describe a situation where you persuaded someone.',hint:'Context → argument → outcome.'},
    {q:'How do you prioritise multiple tasks?',hint:'Impact vs effort framework.'},
    {q:'Tell me about a time you helped a teammate.',hint:'Focus on their outcome.'}
  ]
};


const FOLLOWUPS={
  short:['Can you elaborate with a specific example?','What was your exact role?','Walk me through the steps.'],
  noNumber:['Can you quantify the impact — percentages, time saved?','What were the concrete numbers?'],
  hasStar:['Good structure. What would you do differently in hindsight?','How did your team respond?'],
  general:['What was the most challenging part?','How did you decide on that approach?','What would you do differently?']
};


window.startInterview=async type=>{
  const career=currentCareer();
  const bank=type==='technical'
    ?career.interview.map(question=>({q:question,hint:`Answer as a ${career.role}; explain your reasoning and give a relevant example.`}))
    :INTERVIEW_BANK[type];
  if(!bank){toast('Interview type is unavailable.','error');return}
  const interview={type,role:career.role,qIndex:0,questions:bank.slice(0,5).map(item=>({q:item.q,hint:item.hint,answer:'',followUp:null})),finished:false,feedback:null,aiEnabled:false,loadingAI:!!state.user?.authenticated};
  state.interview=interview;
  go('interview');
  if(interview.loadingAI){
    try{
      const result=await requestAI('interview_questions',{role:career.role,field:career.field,count:5});
      if(state.interview!==interview)return;
      const questions=result?.questions;
      if(!Array.isArray(questions)||questions.length<3||questions.some(item=>typeof item.q!=='string'||typeof item.hint!=='string')){
        throw new Error('The AI service returned interview questions in an unsupported format.');
      }
      interview.questions=questions.slice(0,5).map(item=>({q:item.q,hint:item.hint,answer:'',followUp:null}));
      interview.aiEnabled=true;
    }catch(error){
      toast(`Could not generate AI interview questions: ${error.message}. Using the role-specific practice set.`,'error',6000);
    }finally{
      interview.loadingAI=false;
      if(state.interview===interview)render(false);
    }
  }
};
window.setInterviewAnswer=(i,v)=>{state.interview.questions[i].answer=v};
window.nextInterview=async()=>{
  const it=state.interview;
  if(it.evaluating||it.loadingAI)return;
  if(!it.questions[it.qIndex].answer.trim()){toast('Please write an answer.','error');return}
  const cur=it.questions[it.qIndex];
  if(!cur.followUp){
    const a=cur.answer.toLowerCase().trim();
    const wc=a.split(/\s+/).filter(Boolean).length;
    const hasNum=/\d/.test(a);
    const hasStar=/\b(first|then|next|finally|because|so|result|learned|impact|led to)\b/.test(a);
    if(it.aiEnabled&&state.user?.authenticated){
      try{
        const result=await requestAI('interview_followup',{role:it.role,field:currentCareer().field,question:cur.q,answer:cur.answer});
        if(typeof result?.followUp!=='string'||!result.followUp.trim())throw new Error('The AI response did not include a follow-up question.');
        cur.followUp=result.followUp.trim();
      }catch(error){
        toast(`Could not generate an AI follow-up: ${error.message}. Using a practice prompt instead.`,'error',5000);
        const pool=wc<25?FOLLOWUPS.short:!hasNum?FOLLOWUPS.noNumber:hasStar?FOLLOWUPS.hasStar:FOLLOWUPS.general;
        cur.followUp=pool[Math.floor(Math.random()*pool.length)];
      }
    }else{
      const pool=wc<25?FOLLOWUPS.short:!hasNum?FOLLOWUPS.noNumber:hasStar?FOLLOWUPS.hasStar:FOLLOWUPS.general;
      cur.followUp=pool[Math.floor(Math.random()*pool.length)];
    }
    render(false);
    return;
  }
  if(it.qIndex<it.questions.length-1){it.qIndex++;render(false);return}
  await finishInterview();
};
window.finishInterviewEarly=()=>{
  const it=state.interview;
  const answered=it.questions.filter(q=>q.answer.trim()).length;
  if(!answered){toast('Answer at least one question.','error');return}
  confirmDialog('Finish interview early?',()=>finishInterview(),{yesLabel:'Finish'});
};
async function finishInterview(){
  const it=state.interview;
  if(it.evaluating)return;
  it.evaluating=true;
  it.feedback=scoreInterview(it);
  if(it.aiEnabled&&state.user?.authenticated){
    try{
      const result=await requestAI('interview_feedback',{
        role:it.role,field:currentCareer().field,
        answers:it.questions.filter(question=>question.answer.trim()).map(question=>({question:question.q,answer:question.answer}))
      });
      if(!Number.isInteger(result?.score)||!Array.isArray(result.answers)||typeof result.overall!=='string'){
        throw new Error('The AI service returned interview feedback in an unsupported format.');
      }
      const answers=new Map(result.answers.map(answer=>[answer.question,answer]));
      const per=it.questions.map((question,index)=>{
        const answer=answers.get(question.q);
        return{...it.feedback.per[index],overall:Number.isInteger(answer?.score)?clamp(answer.score,0,100):it.feedback.per[index].overall,feedback:answer?.feedback||''};
      });
      it.feedback={...it.feedback,overall:clamp(result.score,0,100),per,isAI:true,overallText:result.overall,nextSteps:Array.isArray(result.nextSteps)?result.nextSteps.filter(step=>typeof step==='string'):[]};
    }catch(error){
      toast(`Could not generate AI interview feedback: ${error.message}. Showing a practice estimate instead.`,'error',6000);
    }
  }
  it.evaluating=false;
  it.finished=true;
  state.interviews.push({type:it.type,at:new Date().toISOString(),overall:it.feedback.overall,isAI:it.feedback.isAI});
  state.interviewsDone=state.interviews.length;
  if(state.interviewsDone>=5&&!state.badges.includes('b5'))state.badges.push('b5');
  state.activity.unshift({type:'interview',icon:'🎤',color:'from-rose-500 to-pink-600',text:`Completed a <b>${it.type}</b> mock interview`,at:new Date().toISOString(),id:uid()});
  render(false);
  confetti(40);
  toast('Interview completed!','success');
}
window.exitInterview=()=>{state.interview=null;go('interview')};


function scoreInterview(it){
  const per=it.questions.map((q,i)=>{
    const words=q.answer.trim().split(/\s+/).filter(Boolean).length;
    const sents=q.answer.split(/[.!?]+/).filter(s=>s.trim().length>3).length;
    const hasStructure=/\b(first|second|then|finally|because|so|therefore|for example|for instance|in my)\b/i.test(q.answer);
    const hasNumber=/\d/.test(q.answer);
    const relevance=Math.min(100,Math.round(words*1.7));
    const structure=Math.min(100,Math.round(sents*18+(hasStructure?20:0)));
    const communication=Math.min(100,Math.round(words*1.5+(sents>1?15:0)));
    const technical=it.type==='technical'&&isCodeCareer()?Math.min(100,Math.round(relevance*.6+(hasNumber?35:0))):null;
    const overall=technical!==null?Math.round((relevance+structure+communication+technical)/4):Math.round((relevance+structure+communication)/3);
    return{i,words,relevance,structure,communication,technical,overall};
  });
  const avg=k=>Math.round(per.reduce((a,p)=>a+p[k],0)/per.length);
  return{per,communication:avg('communication'),relevance:avg('relevance'),structure:avg('structure'),technical:it.type==='technical'&&isCodeCareer()?avg('technical'):null,overall:Math.round(per.reduce((a,p)=>a+p.overall,0)/per.length),isAI:false};
}

        <button onclick="exitInterview()" class="btn-ghost card-flat px-4 py-2.5 rounded-lg text-sm text-slate-400 hover:text-bad">Exit</button>
        <div class="flex gap-1.5 flex-wrap justify-center">
          ${it.questions.map((_,i)=>`<div class="w-2.5 h-2.5 rounded-full transition-all ${i===it.qIndex?'bg-brand-500 scale-125 shadow-glow':i<it.qIndex?'bg-brand-500/50':'bg-ink-600'}"></div>`).join('')}
        </div>
        <button onclick="nextInterview()" ${it.loadingAI||it.evaluating?'disabled':''} class="btn-primary text-white px-5 py-2.5 rounded-lg text-sm font-semibold disabled:opacity-60">
          ${it.loadingAI?'Generating questions…':it.evaluating?'Preparing feedback…':showFollowUp?'Continue →':it.qIndex===it.questions.length-1?'Finish':'Next →'}
        </button>
      </div>
    </div>
  `);
}

window.setCode=v=>{state.code.src=v};

window.setProblem=id=>{const p=careerCodingProblems().find(x=>x.id===id);if(!p)return;state.code.problemId=id;state.code.src=p.starter[state.code.lang]||p.starter.python;state.code.output='';state.code.review=null;render(false)};
window.loadProblemExample=i=>{const p=careerCodingProblems().find(x=>x.id===state.code.problemId);if(p&&p.tests[i])state.code.stdin=p.tests[i].input+'\n';render(false)};


const PISTON_LANG={python:{language:'python',version:'3.10.0'},javascript:{language:'javascript',version:'18.15.0'},java:{language:'java',version:'15.0.2'},cpp:{language:'c++',version:'10.2.0'}};


window.runCode=async()=>{
  state.code.running=true;state.code.output='';
  render(false);
  const code=state.code.src;
  const lang=state.code.lang;
  const stdin=state.code.stdin;


  try{
    const resp=await fetch('https://emkc.org/api/v2/piston/execute',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        language:PISTON_LANG[lang].language,
        version:PISTON_LANG[lang].version,
        files:[{name:lang==='cpp'?'main.cpp':lang==='java'?'Main.java':lang==='python'?'main.py':'main.js',content:code}],
        stdin:stdin
      })
    });
    const data=await resp.json();
    if(data.run){
      const out=(data.run.stdout||'')+(data.run.stderr?`\n[stderr]\n${data.run.stderr}`:'');
      state.code.output=out||'(no output)';
      if(data.run.code!==0)state.code.output+=`\n\n[exit code ${data.run.code}]`;
    }else if(data.message){
      state.code.output=`[Execution error]\n${data.message}`;
    }else{
      state.code.output='[Unexpected response]';
    }
  }catch(e){
    state.code.output=`[Network error — real execution requires internet to reach the Piston sandbox]\n\n${e.message}\n\nThe code editor remains functional as a workspace. Execution is provided by the free public Piston API (no key required).`;
  }
  state.code.running=false;
  render(false);
};
window.reviewCode=async()=>{
  if(!isCodeCareer()){toast(`Code practice is not part of the ${currentCareer().role} pathway.`,'info');return}
  if(!state.code.src.trim()){toast('Add code before requesting a review.','error');return}
  const problem=careerCodingProblems().find(item=>item.id===state.code.problemId);
  state.code.review={loading:true};render(false);
  try{
    const result=await requestAI('code_review',{
      role:currentCareer().role,language:state.code.lang,
      task:problem?.statement||problem?.title||currentCareer().role,
      code:state.code.src
    });
    if(!result||typeof result.summary!=='string'||!Array.isArray(result.issues)||!Array.isArray(result.suggestions)){
      throw new Error('The AI service returned a code review in an unsupported format.');
    }
    state.code.review={...result,loading:false};
    state.activity.unshift({type:'coding-review',icon:'🧠',color:'from-violet-500 to-purple-600',text:`Reviewed a ${esc(currentCareer().role)} solution with Gemini`,at:new Date().toISOString(),id:uid()});
  }catch(error){
    state.code.review={loading:false,error:error.message};
    toast(`Gemini code review failed: ${error.message}`,'error',6000);
  }
  render(false);
};
window.copyCode=()=>{navigator.clipboard.writeText(state.code.src);toast('Code copied','success',1600)};
window.downloadCode=()=>{
  const ext={python:'py',javascript:'js',java:'java',cpp:'cpp'}[state.code.lang];
  const blob=new Blob([state.code.src],{type:'text/plain'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`solution.${ext}`;a.click();
};
window.syncGutter=()=>{
  const ta=$('#codeArea');if(!ta)return;
  const lines=ta.value.split('\n').length;
  const g=$('.gutter');if(!g)return;
  const cur=g.children.length;
  if(lines>cur){for(let i=cur;i<lines;i++){const d=document.createElement('div');d.className='ln';d.textContent=i+1;g.appendChild(d)}}
  else if(lines<cur){for(let i=cur;i>lines;i--)g.removeChild(g.lastChild)}
};
window.loadSubmission=id=>{const s=state.codeSubs.find(x=>x.id===id);if(!s)return;state.code.lang=s.lang;state.code.src=s.code;render(false);toast('Submission loaded','success',1800)};

window.startGD=topicIdx=>{
  const topic=currentCareer().discussion[topicIdx];
  if(!topic){toast('That discussion is not available for this career path.','error');return}
  const career=currentCareer();
  state.gd={topic:{title:topic,tag:career.role},role:career.role,field:career.field,messages:[{role:'system',text:'Practice simulation started. Participants are AI-generated, not real people.'}],elapsed:0,startedAt:Date.now(),active:true};
  go('gd');
  startGDTimer();
  setTimeout(()=>aiGDReply('opener'),1600);
};
let _gdTimer=null;
function startGDTimer(){
  clearInterval(_gdTimer);
  _gdTimer=setInterval(()=>{
    if(!state.gd||!state.gd.active){clearInterval(_gdTimer);return}
    state.gd.elapsed++;
    const el=document.getElementById('gdTimer');
    if(el)el.textContent=fmtT(state.gd.elapsed);
  },1000);
}
window.sendGDMessage=()=>{
  const inp=document.getElementById('gdInput');if(!inp)return;
  const txt=inp.value.trim();if(!txt)return;
  inp.value='';
  state.gd.messages.push({role:'you',text:txt});
  render(false);scrollGD();
  setTimeout(()=>aiGDReply(classifyGDMessage(txt)),900);
};
function classifyGDMessage(t){
  const s=t.toLowerCase();
  if(/\?/.test(t))return 'question';
  if(/\d+%|percent|million|billion|study|research|data/.test(s))return 'data';
  if(/agree|exactly|right|true|correct/.test(s))return 'agree';
  if(/disagree|but|however|wrong/.test(s))return 'disagree';
  if(/summar|conclude|overall|finally/.test(s))return 'summarize';
  return 'redirect';
}
async function aiGDReply(kind){
  if(!state.gd||!state.gd.active)return;
  if(state.user?.authenticated){
    try{
      const discussion=state.gd;
      const result=await requestAI('gd_reply',{
        role:discussion.role,field:discussion.field,topic:discussion.topic.title,
        messages:discussion.messages.slice(-8).map(message=>({speaker:message.role==='you'?'Candidate':message.name||message.role,text:message.text}))
      });
      if(state.gd!==discussion||!discussion.active)return;
      if(!Array.isArray(result?.replies)||result.replies.length<1||result.replies.some(reply=>
        !Number.isInteger(reply.speakerIndex)||reply.speakerIndex<0||reply.speakerIndex>=GD_PARTICIPANTS.length||typeof reply.message!=='string'
      ))throw new Error('The AI service returned discussion replies in an unsupported format.');
      result.replies.slice(0,2).forEach(reply=>{
        discussion.messages.push({name:GD_PARTICIPANTS[reply.speakerIndex].name,text:reply.message});
      });
      render(false);scrollGD();return;
    }catch(error){
      toast(`Could not get AI discussion responses: ${error.message}. Showing a demo response instead.`,'error',5500);
    }
  }
  const participant=GD_PARTICIPANTS[Math.floor(Math.random()*GD_PARTICIPANTS.length)];
  const replies=GD_REPLIES[kind]||GD_REPLIES.redirect;
  const reply=replies[Math.floor(Math.random()*replies.length)];
  state.gd.messages.push({name:participant.name,text:reply});
  render(false);scrollGD();
  if(Math.random()>0.5){
    setTimeout(()=>{
      if(!state.gd||!state.gd.active)return;
      const p2=GD_PARTICIPANTS.filter(p=>p.name!==participant.name)[Math.floor(Math.random()*2)];
      const r2=GD_REPLIES[['agree','data','redirect'][Math.floor(Math.random()*3)]];
      state.gd.messages.push({name:p2.name,text:r2[Math.floor(Math.random()*r2.length)]});
      render(false);scrollGD();
    },1400);
  }
}
function scrollGD(){setTimeout(()=>{const el=document.getElementById('gdMessages');if(el)el.scrollTop=el.scrollHeight},60)}
window.exitGD=()=>{state.gd=null;clearInterval(_gdTimer);go('gd')};
window.endGD=()=>{
  if(!state.gd)return;
  state.gd.active=false;clearInterval(_gdTimer);
  const myMsgs=state.gd.messages.filter(m=>m.role==='you').length;
  const score=Math.min(100,myMsgs*18+40);
  confetti(30);
  modal({
    title:'GD Report',size:'md',
    body:`<div class="text-center mb-5"><div class="text-5xl font-black grad-text tabular-nums">${score}</div><div class="text-xs text-slate-500 mt-1">Practice score</div></div>

      <div class="flex flex-wrap gap-2">${a.fillers.map(f=>`<span class="text-xs px-2.5 py-1 rounded-full bg-warn/10 text-warn border border-warn/30 font-medium">"${esc(f.word)}" × ${f.count}</span>`).join('')}</div></div>`:''}

window.nextPrompt=()=>{const idx=FLUENCY_PROMPTS.indexOf(state.fluency.prompt);state.fluency.prompt=FLUENCY_PROMPTS[(idx+1)%FLUENCY_PROMPTS.length];state.fluency.analysis=null;render(false)};
let _recognition=null;
window.toggleListening=()=>{
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){toast('Speech recognition not supported. Please type.','warn');return}
  if(state.fluency.listening){_recognition?.stop();state.fluency.listening=false;render(false);return}
  _recognition=new SR();
  _recognition.continuous=true;
  _recognition.interimResults=true;
  _recognition.lang=state.lang==='hi'?'hi-IN':'en-IN';
  _recognition.onresult=e=>{
    let transcript='';
    for(let i=e.resultIndex;i<e.results.length;i++)transcript+=e.results[i][0].transcript;
    state.fluency.text=(state.fluency.text+' '+transcript).trim();
    const box=document.getElementById('fluencyBox');
    if(box)box.value=state.fluency.text;
  };
  _recognition.onerror=()=>{state.fluency.listening=false;render(false)};
  _recognition.onend=()=>{state.fluency.listening=false;render(false)};
  _recognition.start();
  state.fluency.listening=true;
  render(false);
  toast('Listening — speak clearly','success',1600);
};
window.analyzeFluency=()=>{
  const text=state.fluency.text.trim();
  if(text.split(/\s+/).length<15){toast('Please write at least 15 words.','error');return}
  const words=text.split(/\s+/).filter(Boolean);
  const sentences=text.split(/[.!?]+/).filter(s=>s.trim().length>3);
  const avgLen=words.length/Math.max(1,sentences.length);
  const uniq=new Set(words.map(w=>w.toLowerCase().replace(/[^a-z]/g,'')));
  const uniqRatio=uniq.size/words.length;
  const fillers=['um','uh','like','you know','basically','actually','so','well'].map(w=>({word:w,count:(text.toLowerCase().match(new RegExp('\\b'+w.replace(' ','\\\\s')+'\\b','g'))||[]).length})).filter(x=>x.count>0);
  const structure=/\b(first|second|then|next|finally|because|however|therefore|for example)\b/i.test(text)?78:55;
  const clarity=clamp(Math.round(100-Math.abs(avgLen-15)*4),30,98);
  const vocab=clamp(Math.round(uniqRatio*130),40,98);
  const confidence=clamp(Math.round((100-fillers.reduce((a,x)=>a+x.count,0)*4)*0.8+20),40,98);
  const strengths=[];const improvements=[];
  if(avgLen>=10&&avgLen<=20)strengths.push('Sentence length is easy to follow.');else improvements.push(avgLen>20?'Break up long sentences.':'Add more detail.');
  if(uniqRatio>0.6)strengths.push('Strong vocabulary variety.');else improvements.push('Vary your word choice.');
  if(structure>=70)strengths.push('Clear structure with transitions.');else improvements.push('Use connectors: "First… then… finally…".');
  if(fillers.length===0)strengths.push('No filler words — clean delivery.');else improvements.push(`Reduce fillers: ${fillers.map(f=>f.word).join(', ')}.`);
  state.fluency.analysis={clarity,vocab,structure,confidence,fillers,strengths,improvements};
  render(false);
  toast('Analysis ready','success');
};

  const tasks=[];
  weak.forEach((w,i)=>{

window.requestMentor=id=>{
  if(!state.user?.authenticated){toast('Demo accounts cannot send real chat requests. Sign in with Supabase to contact students.','info',5000);return}
  void sendMentorRequest(id);
};
window.refreshCommunityData=()=>{state.communityLoaded=false;state.communityLoading=false;state.communityError='';render(false)};
async function loadCommunityData(){
  if(!supabaseClient||!state.user?.authenticated)return;
  try{
    const[{data:profiles,error:profilesError},{data:requests,error:requestsError},{data:forum,error:forumError}]=await Promise.all([
      supabaseClient.from('profiles').select('id,display_name,field_of_study,target_role').neq('id',state.user.id).limit(200),
      supabaseClient.from('chat_requests').select('*').or(`requester_id.eq.${state.user.id},recipient_id.eq.${state.user.id}`).order('created_at',{ascending:false}),
      supabaseClient.from('forum_threads').select('*').order('created_at',{ascending:false}).limit(100)
    ]);
    if(profilesError)throw profilesError;
    if(requestsError)throw requestsError;
    if(forumError)throw forumError;
    state.communityProfiles=profiles||[];
    state.communityPeers=state.communityProfiles.filter(profile=>profile.target_role===state.user.targetRole);
    state.chatRequests=requests||[];
    state.communityThreads=(forum||[]).map(thread=>{
      const author=state.communityProfiles.find(profile=>profile.id===thread.author_id)?.display_name||'Student';
      return{...thread,author,avatar:ini(author)};
    });
    state.communityLoaded=true;state.communityLoading=false;state.communityError='';
    if(state.view==='community')render(false);
  }catch(error){
    state.communityLoading=false;state.communityLoaded=true;state.communityError=error.message;
    toast(`Could not load community data: ${error.message}`,'error',6000);
    if(state.view==='community')render(false);
  }
}
async function sendMentorRequest(id){
  if(!state.user?.authenticated||!supabaseClient){toast('Sign in with a Supabase account to request a real 1:1 chat.','info',4500);return}
  if(id===state.user.id){toast('You cannot request a chat with yourself.','error');return}
  const peer=state.communityProfiles.find(profile=>profile.id===id&&profile.target_role===state.user.targetRole);
  if(!peer){toast('That student is no longer available for your career goal. Refresh the peer list.','error',5000);return}
  try{
    const{data:existing,error:lookupError}=await supabaseClient.from('chat_requests').select('id,status')
      .eq('requester_id',state.user.id).eq('recipient_id',id).maybeSingle();
    if(lookupError)throw lookupError;
    if(existing){
      toast(`A chat request already exists (${existing.status}). Check your Requests tab.`,'info',5000);return;
    }
    const{error}=await supabaseClient.from('chat_requests').insert({
      requester_id:state.user.id,recipient_id:id,job_role:state.user.targetRole||''
    });
    if(error)throw error;
    toast(`1:1 request sent to ${peer.display_name||'the student'}.`,'success',4500);
    await refreshCommunityData();
  }catch(error){toast(`Could not send chat request: ${error.message}`,'error',6000)}
}
window.respondToChat=async(id,status)=>{
  if(!['accepted','declined'].includes(status)||!state.user?.authenticated)return;
  try{
    const{error}=await supabaseClient.from('chat_requests').update({status}).eq('id',id).eq('recipient_id',state.user.id);
    if(error)throw error;
    toast(status==='accepted'?'Chat request accepted.':'Chat request declined.','success');
    refreshCommunityData();
  }catch(error){toast(`Could not update the chat request: ${error.message}`,'error',6000)}
};
let activeChatChannel=null;
function appendChatMessage(message){
  const list=$('#chatMessageList');
  if(!list||list.querySelector(`[data-message-id="${message.id}"]`))return;
  const row=document.createElement('div');
  row.dataset.messageId=message.id;
  row.className=`max-w-[85%] rounded-xl px-3 py-2 text-sm ${message.sender_id===state.user.id?'ml-auto bg-brand-500/20 text-white':'bg-ink-700 text-slate-200'}`;
  const sender=message.sender_id===state.user.id?state.user.name:
    state.communityProfiles.find(profile=>profile.id===message.sender_id)?.display_name||'Student';
  row.textContent=`${sender}: ${message.body}`;
  list.appendChild(row);list.scrollTop=list.scrollHeight;
}
window.openChat=async requestId=>{
  const request=state.chatRequests.find(item=>item.id===requestId&&item.status==='accepted');
  if(!request||!state.user?.authenticated){toast('This accepted student chat is not available.','error');return}
  try{
    const{data:messages,error}=await supabaseClient.from('chat_messages').select('*').eq('request_id',requestId).order('created_at',{ascending:true}).limit(200);
    if(error)throw error;
    const peerId=request.requester_id===state.user.id?request.recipient_id:request.requester_id;
    const peerName=state.communityProfiles.find(profile=>profile.id===peerId)?.display_name||'Student';
    modal({title:`Chat · ${state.user.targetRole||'Career preparation'}`,size:'lg',body:`
      <div class="text-xs text-slate-400 mb-3">Chat with ${esc(peerName)} about ${esc(request.job_role||'their career goal')}.</div>
      <div id="chatMessageList" class="h-72 overflow-y-auto space-y-2 card-flat p-3"></div>
      <form id="chatMessageForm" data-request-id="${requestId}" onsubmit="sendChatMessage(event)" class="flex gap-2 mt-3">
        <input id="chatMessageInput" maxlength="4000" required class="flex-1 bg-ink-800 border border-ink-650 rounded-lg px-3 py-2 text-sm text-white" placeholder="Write a message…"/>
        <button class="btn-primary px-4 py-2 rounded-lg text-sm text-white font-semibold">Send</button>
      </form>`,actions:[{label:'Close',class:'btn-ghost card-flat px-5 py-2.5 rounded-xl text-sm text-slate-300'}]});
    messages.forEach(appendChatMessage);
    if(activeChatChannel)await supabaseClient.removeChannel(activeChatChannel);
    const modalRoot=$('#modalRoot').lastElementChild;
    const observer=new MutationObserver(()=>{
      if(!modalRoot.isConnected){
        observer.disconnect();
        if(activeChatChannel)supabaseClient.removeChannel(activeChatChannel);
        activeChatChannel=null;
      }
    });
    observer.observe($('#modalRoot'),{childList:true});
    activeChatChannel=supabaseClient.channel(`chat-messages-${requestId}`)
      .on('postgres_changes',{event:'INSERT',schema:'public',table:'chat_messages',filter:`request_id=eq.${requestId}`},payload=>appendChatMessage(payload.new))
      .subscribe(status=>{if(status==='CHANNEL_ERROR')toast('Live chat connection failed. Refresh to reconnect.','error',5000)});
  }catch(error){toast(`Could not open chat: ${error.message}`,'error',6000)}
};
window.sendChatMessage=async event=>{
  event.preventDefault();
  const form=event.currentTarget;
  const input=$('#chatMessageInput');
  const body=input?.value.trim();
  if(!body||!state.user?.authenticated)return;
  try{
    const{data,error}=await supabaseClient.from('chat_messages').insert({
      request_id:form.dataset.requestId,sender_id:state.user.id,body
    }).select().single();
    if(error)throw error;
    input.value='';appendChatMessage(data);
  }catch(error){toast(`Could not send message: ${error.message}`,'error',6000)}
};
window.likeThread=id=>{
  if(state.user?.authenticated){toast('Forum reactions are not stored yet.','info');return}
  const thread=FORUM_THREADS.find(item=>item.id===id);if(thread){thread.likes++;render(false)}
};
window.postThread=async()=>{
  const el=document.getElementById('newThreadTitle');
  const val=el?.value.trim();if(!val)return;
  if(state.user?.authenticated){
    try{
      const{error}=await supabaseClient.from('forum_threads').insert({
        author_id:state.user.id,title:val,body:val,job_role:state.user.targetRole||''
      });
      if(error)throw error;
      el.value='';await loadCommunityData();toast('Discussion posted to the shared forum.','success');
    }catch(error){toast(`Could not post to the forum: ${error.message}`,'error',6000)}
    return;
  }
  FORUM_THREADS.unshift({id:'t'+uid(),title:val,author:state.user.name,avatar:state.user.avatar,replies:0,likes:0,tag:'Question',time:'just now',body:'Posted from the forum composer.',mine:true});
  el.value='';render(false);toast('Thread posted','success');
};

    ${Array.isArray(r.gaps)&&r.gaps.length?`<div class="card p-6"><h3 class="text-white font-bold mb-3">Role-specific gaps</h3><ul class="list-disc list-inside text-sm text-slate-300 space-y-2">${r.gaps.map(item=>`<li>${esc(item)}</li>`).join('')}</ul></div>`:''}
    ${Array.isArray(r.recommendations)&&r.recommendations.length?`<div class="card p-6"><h3 class="text-white font-bold mb-3">Recommended improvements</h3><ul class="list-disc list-inside text-sm text-slate-300 space-y-2">${r.recommendations.map(item=>`<li>${esc(item)}</li>`).join('')}</ul></div>`:''}
    <div class="card-flat p-4 text-xs text-slate-500 flex items-start gap-3 reveal"><span>⚠️</span><span>AI review is based on the public GitHub metadata and LinkedIn evidence you provide. LinkedIn profile contents are not fetched by the app. This is guidance, not a hiring guarantee.</span></div>
  </div>`;
}
function validProfileUrl(raw,host,pathPattern){
  try{
    const url=new URL(/^https?:\/\//i.test(raw)?raw:`https://${raw}`);
    return url.protocol==='https:'&&[host,`www.${host}`].includes(url.hostname.toLowerCase())&&
      pathPattern.test(url.pathname)&&!url.search&&!url.hash;
  }catch{return false}
}
window.analyzePortfolio=async()=>{
  const p=state.portfolio;
  const linkedin=p.linkedin.trim(),github=p.github.trim();
  if(!linkedin&&!github){toast('Enter a LinkedIn or GitHub profile URL.','error');return}
  if(linkedin&&!validProfileUrl(linkedin,'linkedin.com',/^\/in\/[\w-]+\/?$/i)){toast('Enter a LinkedIn personal profile URL such as linkedin.com/in/yourname.','error');return}
  if(github&&!validProfileUrl(github,'github.com',/^\/[A-Za-z0-9-]{1,39}\/?$/)){toast('Enter a GitHub user profile URL such as github.com/yourname.','error');return}
  if(!state.user?.authenticated){toast('Sign in to use the secure Gemini portfolio review.','info',4500);return}
  p.loading=true;p.error='';p.report=null;render(false);
  try{
    const result=await requestAI('portfolio_review',{
      role:currentCareer().role,field:currentCareer().field,linkedinUrl:linkedin,githubUrl:github,
      linkedinEvidence:(p.linkedinEvidence||'').slice(0,8000)
    });
    const validTextList=value=>Array.isArray(value)&&value.every(item=>typeof item==='string');
    if(!result||typeof result.summary!=='string'||!Number.isInteger(result.overall)||result.overall<0||result.overall>100||
      !validTextList(result.linkedinFeedback)||!validTextList(result.githubFeedback)||
      !validTextList(result.gaps)||!validTextList(result.recommendations)||
      (result.githubEvidence!==undefined&&typeof result.githubEvidence!=='string')){
      throw new Error('The AI service returned a portfolio report in an unsupported format.');
    }
    p.report=result;
    state.activity.unshift({type:'portfolio-review',icon:'📊',color:'from-cyan-500 to-blue-600',text:`Reviewed portfolio for <b>${esc(currentCareer().role)}</b>`,at:new Date().toISOString(),id:uid()});
    toast('AI portfolio review complete.','success');
  }catch(error){p.error=`Portfolio review failed: ${error.message}`;toast(p.error,'error',6000)}
  finally{p.loading=false;render(false)}
};

window.assignUserRole=async(userId,role)=>{

};

document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();if(state.user)openSearch()}
  if(e.key==='Escape'&&state.searchOpen)closeSearch();
  if(e.key==='Escape'&&state.activeTest&&!state.activeTest.submitted){
    if(confirm('Exit the test? Your progress will be lost.')){state.activeTest=null;clearInterval(_timer);go('tests')}
  }
});
window.addEventListener('beforeunload',()=>{persist()});

async function initializeApp(){
  if(!supabaseClient){
    render(false);
    return;
  }
  supabaseClient.auth.onAuthStateChange(event=>{
    if(event==='SIGNED_OUT'&&state.user?.authenticated){
      state.user=null;
      state.view='login';
      render(true);
    }
  });
  const{data,error}=await supabaseClient.auth.getSession();
  if(error){
    state.user=null;
    state.view='login';
    render(false);
    toast(`Could not restore your sign-in: ${error.message}`,'error',7000);
    return;
  }
  if(!data.session){
    state.user=null;
    state.view='login';
    render(false);
    return;
  }
  try{
    await loadAuthenticatedUser(data.session.user);
  }catch(error){
    state.user=null;
    state.view='login';
    render(false);
    toast(error.message,'error',7000);
  }
}
